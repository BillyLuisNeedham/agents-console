[package]
name = "ac-io"
description = "The I/O edges: git, the herdr client, child processes, and Jev over TypeSafe's HTTP API"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ac-protocol.workspace = true
ac-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tokio-util.workspace = true
regex.workspace = true
chrono.workspace = true
libc.workspace = true
nix.workspace = true
reqwest.workspace = true
sha2.workspace = true

[features]
# The Jev port fake (`ac_io::jev::fake`), for the engine's own tests.
fake = []

[dev-dependencies]
tempfile.workspace = true
# The fake TypeSafe endpoint the Jev client's tests talk to.
axum.workspace = true
# Paused time, so the RPC watchdog's 10 s passes without being waited out.
tokio = { workspace = true, features = ["test-util"] }
