# The Console's Rust workspace (ADR-0036, issue #162). One binary, `agent-console`, with boot, server,
# steward and fleet subcommands, built from layered crates: protocol <- core <- io <- engine <- server <- cli.
[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/io", "crates/engine", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
ac-protocol = { path = "crates/protocol" }
ac-core = { path = "crates/core" }
ac-io = { path = "crates/io" }
ac-engine = { path = "crates/engine" }
ac-server = { path = "crates/server" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: objects keep their insertion order, as JavaScript's do, so files and frames read the same.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
axum = { version = "0.8", features = ["ws"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
nix = { version = "0.30", features = ["signal", "process", "fs", "term", "user"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8"
mime_guess = "2"
indexmap = { version = "2", features = ["serde"] }
tempfile = "3"

[profile.release]
debug = "line-tables-only"
