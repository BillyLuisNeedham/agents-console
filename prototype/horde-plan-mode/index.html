      ['One slice: one builder', 'finish grill#1.1 done items 1'],
      ['Builder done: one branch passes through', 'finish builder#1.1 done'],
      ['Review finds a problem: loop pass 1 of 1', 'finish review#1.1 findings items 1'],
      ['Fixed', 'finish builder#2.1 done'],
      ['Review finds another: the Steward allows one extra pass', 'finish review#2.1 findings items 1'],
      ['Fixed', 'finish builder#3.1 done'],
      ['Review finds a third: now it asks you', 'finish review#3.1 findings items 1'],
      ['The Steward tries to allow a pass (refused)', 'as steward: allow review.findings>builder', 'refused'],
      ['You allow one more pass', 'allow review.findings>builder'],
      ['Fixed', 'finish builder#4.1 done'],
      ['Review is clean: Finish', 'finish review#4.1 clean'],
    ],
  },
];
</script>

<script>
/* ============================================================
   The page: a thin shell over Horde. Throwaway.
   ============================================================ */
let state = Horde.run(Horde.empty('Factory today', structuredClone(BUILT_IN)), ['preset Factory today']);
state.log = [];
const ui = { sel: null, linking: null, tab: 'walk', walk: 0, step: 0, agentErr: '', sendAs: 'you' };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const K = Horde.KINDS;

function dispatch(a) { state = Horde.reduce(state, a); if (ui.sel && ui.sel.kind === 'node' && !state.plan.nodes[ui.sel.id]) ui.sel = null; render(); }
function send(line) { dispatch(Horde.parse(line)); }

const liveCount = r => r.copies.filter(c => Horde.ACTIVE.includes(c.status)).length;
const copiesText = c => (c.mode === 'one' ? '×1' : `per item ≤${c.n}`);

function nodeState(id) {
  const r = state.run.nodes[id], n = state.plan.nodes[id];
  if (n && K[n.kind].merger && r && r.armed && r.status !== 'running') return { cls: 'needs', text: 'next merge conflicts' };
  if (!r) return { cls: 'idle', text: 'not run' };
  if (r.status === 'holding') return { cls: 'needs', text: `waiting for ${r.waitingFor.length}` };
  if (r.copies.some(c => c.status === 'checkpoint')) return { cls: 'needs', text: n && K[n.kind].merger ? 'conflict · needs you' : 'needs you' };
  if (r.status === 'waiting') return { cls: 'needs', text: 'closed · open me' };
  if (r.status === 'collecting') return { cls: 'collecting', text: 'collecting' };
  if (r.status === 'running') {
    if (n && K[n.kind].merger) return { cls: 'running', text: 'resolving a conflict' };
    return { cls: 'running', text: r.queue.length ? `${liveCount(r)} running · ${r.queue.length} queued` : `running ${liveCount(r)}/${r.copies.length}` };
  }
  if (r.status === 'parked') return { cls: 'parked', text: 'done · waiting' };
  if (state.run.spent.some(x => state.plan.edges.find(e => e.id === x.edge)?.from === id)) return { cls: 'needs', text: 'loop spent' };
  if (r.status === 'halted') return { cls: 'halted', text: 'halted' };
  if (r.status === 'done') return { cls: 'done', text: r.verdict ? `done · ${r.verdict}` : 'done' };
  return { cls: 'idle', text: r.status };
}

function render() {
  $('plan-name').value = state.plan.name;
  $('clock').textContent = `clock ${state.run.clock}`;
  if (document.activeElement !== $('prompt')) $('prompt').value = state.run.prompt;
  renderPresets(); renderTray(); renderShelf(); renderCanvas(); renderInsp(); renderDrawer();
}

function presetGroups() {
  const groups = {};
  for (const [name, f] of Object.entries(state.presets)) (groups[f.author || 'Yours'] ||= []).push(name);
  return groups;
}
function renderPresets() {
  $('preset').innerHTML = `<option value="">Load a preset…</option>` + Object.entries(presetGroups()).map(([author, names]) =>
    `<optgroup label="${esc(author)}">${names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')}</optgroup>`).join('');
  const p = state.plan;
  $('preset-line').innerHTML = p.source || p.note
    ? `${p.author ? `<b>${esc(p.author)}</b> · ` : ''}${p.source ? `<code>${esc(p.source)}</code> · ` : ''}<span>${esc(p.note)}</span>`
    : '';
  $('preset-line').hidden = !(p.source || p.note);
  $('preset-line').title = p.note ? `${p.note} (in full on the Plan file tab)` : '';
}

function renderTray() {
  const asks = [];
  for (const [id, r] of Object.entries(state.run.nodes)) {
    const merger = state.plan.nodes[id] && K[state.plan.nodes[id].kind].merger;
    for (const c of r.copies) if (c.status === 'checkpoint') asks.push(`<span class="ask">${esc(c.id)} ${merger ? 'hit a merge conflict' : 'at a checkpoint'} <button data-cmd="resume ${c.id}">Resume</button><button data-cmd="close ${c.id}">Close</button></span>`);
    if (r.status === 'waiting') asks.push(`<span class="ask">${esc(id)} is closed <button data-cmd="open ${id}">Open</button></span>`);
  }
  for (const h of state.run.held) asks.push(`<span class="ask held">${esc(h.id)} from ${esc(h.from)}: "${esc(h.what)}" <button data-cmd="adopt ${h.id}">Adopt</button><button data-cmd="discard ${h.id}">Discard</button></span>`);
  for (const x of state.run.spent) asks.push(`<span class="ask">loop ${esc(x.edge)} spent <button data-cmd="allow ${x.edge}">Allow one more</button><button data-cmd="stop ${x.edge}">Stop loop</button></span>`);
  const holding = Object.entries(state.run.nodes).filter(([, r]) => r.status === 'holding').map(([id, r]) => `<span class="tone-warn">${esc(state.plan.nodes[id]?.title || id)} waiting for: ${esc(r.waitingFor.join(', '))}</span>`).join('');
  const notice = state.notice ? `<span class="notice">✕ ${esc(state.notice)}</span>` : '';
  const done = state.run.finished ? `<span class="tone-good">Run finished.</span>` : '';
  $('tray').innerHTML = `<span class="label">Needs you</span>${asks.join('') || '<span class="dim">nothing</span>'}${holding}${done}${notice}`;
}

function renderShelf() {
  const desc = { grill: 'talk it through', agent: 'any skill', builder: 'writes code, per item', prove: 'pass / fail', review: 'clean / findings', decide: 'ship / again', merger: 'folds branches in', gate: 'join + approve', finish: 'ends the run' };
  $('shelf').innerHTML = `<h3>Put down</h3>` + Object.entries(K).map(([k, v]) => `<button data-cmd="add ${k}">${v.label}<span class="k">${desc[k]}</span></button>`).join('');
}

function cardHtml(n) {
  const st = nodeState(n.id), r = state.run.nodes[n.id];
  const kind = K[n.kind];
  const chips = [];
  if (Horde.isAgent(n.kind)) {
    chips.push(`<span class="chip spawn-${n.spawn}">spawn ${n.spawn}</span>`);
    chips.push(`<span class="chip">checkpoint ${n.checkpoint}</span>`);
    chips.push(`<span class="chip on">${copiesText(n.copies)}</span>`);
    if (n.copies.mode !== 'one') { const m = Horde.mergerOf(state, n.id); chips.push(`<span class="chip merge">${m ? `⋈ ${esc(m.id)}` : 'no merger'}</span>`); }
  } else if (kind.merger) {
    chips.push(`<span class="chip on">merges ${esc(n.of || 'what comes in')}</span>`, `<span class="chip">conflict: ${n.conflict}</span>`);
    if (r && r.armed) chips.push(`<span class="chip armed">next merge conflicts</span>`);
  } else if (kind.gate) {
    chips.push(`<span class="chip on">opens: ${n.open}</span>`, `<span class="chip">join ${n.join}</span>`);
  }
  const sub = Horde.isAgent(n.kind) || kind.merger ? `<span class="dim">${esc(n.skill || 'no skill')}</span><span class="dim">${esc(n.harness)} · ${esc(n.model)} · ${esc(n.effort)}</span>` : `<span class="dim">${kind.gate ? 'no agent' : 'end of the run'}</span>`;
  const queue = r && (r.queue.length || (n.copies && n.copies.mode === 'per-item' && r.status === 'running')) ? ` · ${liveCount(r)} running · ${r.queue.length} queued` : '';
  const dots = r && r.copies.length ? `<div class="copies" title="copies this pass">${r.copies.map(c => `<span class="dot ${c.status}${c.spawned ? ' spawned' : ''}" title="${esc(c.id)}: ${c.status}"></span>`).join('')}${r.queue.map(() => '<span class="dot queued" title="queued"></span>').join('')}<span class="dim" style="font-size:10.5px">pass ${r.pass}${queue}</span></div>` : '';
  const waiting = r && r.status === 'holding' ? `<div class="waitfor">waiting for: ${esc(r.waitingFor.join(', '))}</div>` : '';
  const ports = kind.verdicts.length ? `<div class="ports">${kind.verdicts.map(v => {
    const parked = r && r.parked[v];
    const armed = ui.linking && ui.linking.from === n.id && ui.linking.on === v;
    const linked = state.plan.edges.some(e => e.from === n.id && e.on === v);
    return `<button class="port${parked ? ' parked' : ''}${armed ? ' armed' : ''}${linked ? '' : ' open'}" data-port="${n.id}.${v}" data-ui="port" title="Link: click this, then click the node that follows when it says ${v}">${v} →</button>`;
  }).join('')}</div>` : '';
  const cls = ['card', `k-${n.kind}`, `s-${st.cls === 'collecting' ? 'collecting' : st.cls}`];
  if (ui.sel && ui.sel.kind === 'node' && ui.sel.id === n.id) cls.push('sel');
  if (state.changed.includes(n.id)) cls.push('changed');
  if (ui.linking && ui.linking.from !== n.id) cls.push('linkable');
  return `<div class="${cls.join(' ')}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px">
    <div class="head" data-drag="${n.id}"><span class="id">${esc(n.title)}</span><span class="state ${st.cls}">${st.text}</span></div>
    <div class="body"><div class="row"><span class="badge">${kind.label}</span><span class="dim">${esc(n.id)}</span></div>${sub}<div class="chips">${chips.join('')}</div>${dots}${waiting}</div>
    ${ports}</div>`;
}

function renderCanvas() {
  const nodes = Object.values(state.plan.nodes);
  const c = $('canvas');
  c.style.width = Math.max(2120, ...nodes.map(n => n.x + 320)) + 'px';
  c.style.height = Math.max(560, ...nodes.map(n => n.y + 290)) + 'px';
  const banner = ui.linking ? `<div class="linking-banner">Linking ${esc(ui.linking.from)} "${esc(ui.linking.on)}": click the node that follows. Esc cancels.</div>` : '';
  const hint = nodes.length ? '' : `<div class="empty-hint"><b>An empty factory.</b><br>Put a node down from the shelf on the left. You can run it straight away and decide what follows once you see what it hands over. To link two nodes, click a verdict chip at the bottom of a card (like <b>done →</b>) and then the next node, or use Links in the inspector. When you like the shape, press <b>Save</b>.</div>`;
  c.innerHTML = banner + `<svg id="edges"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8597"></path></marker><marker id="arr-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4cc2ff"></path></marker></defs></svg>` + hint + nodes.map(cardHtml).join('');
  drawEdges();
}

function drawEdges() {
  const svg = $('edges'); if (!svg) return;
  const base = $('canvas').getBoundingClientRect();
  [...svg.querySelectorAll('.e')].forEach(x => x.remove());
  let out = '';
  for (const e of state.plan.edges) {
    const pe = document.querySelector(`[data-port="${e.from}.${e.on}"]`);
    const te = document.querySelector(`[data-node="${e.to}"]`);
    if (!pe || !te) continue;
    const p = pe.getBoundingClientRect(), t = te.getBoundingClientRect();
    const sx = p.left + p.width / 2 - base.left, sy = p.bottom - base.top;
    const srcCard = pe.closest('.card').getBoundingClientRect();
    const below = t.top >= srcCard.bottom - 2 && Math.abs(t.left - srcCard.left) < 60;
    const back = !below && t.left - base.left < sx - 30;
    let d, mx, my;
    if (below) {
      /* a merger sits right under its node: drop straight down into it */
      const ty = t.top - base.top, dy = Math.max(20, (ty - sy) / 2);
      d = `M${sx},${sy} C${sx},${sy + dy} ${sx},${ty - dy} ${sx},${ty}`;
      [mx, my] = [sx, (sy + ty) / 2];
    } else if (!back) {
      const src = pe.closest('.card').getBoundingClientRect();
      const fx = src.right - base.left, fy = p.top + p.height / 2 - base.top;
      const tx = t.left - base.left, ty = t.top - base.top + 16;
      const k = Math.max(30, (tx - fx) / 2);
      d = `M${sx + p.width / 2},${fy} L${fx},${fy} C${fx + k},${fy} ${tx - k},${ty} ${tx},${ty}`;
      [mx, my] = bez([fx, fy], [fx + k, fy], [tx - k, ty], [tx, ty]);
    } else {
      const tx = t.left - base.left + t.width / 2 + 30, ty = t.bottom - base.top;
      const drop = 60 + (Math.abs(sx - tx) / 1600) * 110;
      d = `M${sx},${sy} C${sx},${sy + drop} ${tx},${ty + drop} ${tx},${ty}`;
      [mx, my] = bez([sx, sy], [sx, sy + drop], [tx, ty + drop], [tx, ty]);
    }
    const st = state.run.edges[e.id];
    const hot = state.changed.includes(e.id);
    const spent = state.run.spent.some(x => x.edge === e.id);
    const sel = ui.sel && ui.sel.kind === 'edge' && ui.sel.id === e.id;
    const extra = st && st.extra ? ` +${st.extra}` : '';
    const label = `${e.on}${e.max != null ? ` · ${st ? st.count : 0}/${e.max}${extra}${e.steward ? ' · S' : ''}` : st && st.count ? ` · ×${st.count}` : ''}`;
    const col = spent ? '#f85149' : hot || sel ? '#4cc2ff' : '#3a4560';
    out += `<path class="e" d="${d}" fill="none" stroke="${col}" stroke-width="${sel ? 2.5 : 1.6}" ${back ? 'stroke-dasharray="5 4"' : ''} marker-end="url(#${hot || sel ? 'arr-hot' : 'arr'})"></path>`;
    const w = label.length * 6.1 + 10;
    out += `<g class="e elabel" data-edge="${esc(e.id)}"><title>${e.steward ? 'S: the Steward may allow one extra pass' : esc(e.id)}</title><rect x="${mx - w / 2}" y="${my - 9}" width="${w}" height="18" rx="9" fill="#12161f" stroke="${col}"></rect><text x="${mx}" y="${my + 4}" text-anchor="middle" font-size="10" fill="${spent ? '#f85149' : '#d4dae4'}" font-family="ui-monospace, Liberation Mono, monospace">${esc(label)}</text></g>`;
  }
  svg.insertAdjacentHTML('beforeend', out);
}
function bez(a, b, c, d, t = 0.5) {
  const u = 1 - t;
  return [0, 1].map(i => u * u * u * a[i] + 3 * u * u * t * b[i] + 3 * u * t * t * c[i] + t * t * t * d[i]);
}

function seg(id, field, value, choices) {
  return `<div class="seg">${choices.map(c => `<button class="${c === value ? 'on' : ''}" data-cmd="set ${id} ${field} ${c}">${c}</button>`).join('')}</div>`;
}
const HELP = {
  spawn: { no: 'Proposals are dropped.', ask: 'Proposals wait in Needs you for Adopt or Discard.', yes: 'Proposals become a new copy at once (or queue behind the cap).' },
  checkpoint: { wait: 'The copy stops and waits for you.', steward: 'The Steward answers on your behalf.', continue: 'The engine types "continue" and it carries on.', rest: 'The copy sleeps until the clock ticks; the rest carry on.' },
  open: { operator: 'Waits for you to open it.', steward: 'The Steward opens it for you.', auto: 'Opens as soon as its inputs arrive.' },
  conflict: { resolver: 'A resolver copy runs on this merger\'s harness and model; finishing it with "merged" carries on.', wait: 'Stops at a checkpoint for you.' },
};

function renderInsp() {
  const el = $('insp');
  if (ui.sel && ui.sel.kind === 'edge') {
    const e = state.plan.edges.find(e => e.id === ui.sel.id);
    if (!e) { ui.sel = null; return renderInsp(); }
    const st = state.run.edges[e.id];
    el.innerHTML = `<h3>Link</h3><div><b>${esc(e.from)}</b> says <b>${esc(e.on)}</b> → <b>${esc(e.to)}</b></div>
      <div class="field"><span>Passes allowed${e.max == null ? ' (no cap)' : ''} · used ${st ? st.count : 0}${st && st.extra ? ` · ${st.extra} extra this run` : ''}</span>
      <div class="row"><input type="number" min="1" id="edge-max" value="${e.max ?? ''}" placeholder="none" style="width:6em"><button data-ui="edge-max" data-edge="${esc(e.id)}">Set cap</button><button data-cmd="loop ${e.id} max none">No cap</button></div>
      <span class="help">A link that loops back always keeps a cap. When the cap is used up, the run asks you before going round again.</span></div>
      ${e.max != null ? `<div class="field"><span>The Steward may allow one extra pass</span>${`<div class="seg">${['yes', 'no'].map(v => `<button class="${(e.steward ? 'yes' : 'no') === v ? 'on' : ''}" data-cmd="loop ${e.id} steward ${v}">${v}</button>`).join('')}</div>`}
      <span class="help">${e.steward ? `When the cap is spent, the Steward allows one more pass by itself, once${st && st.stewardUsed ? ' (used this run)' : ''}. After that it asks you.` : 'When the cap is spent, it always asks you.'}</span></div>` : ''}
      <button class="warn" data-cmd="unlink ${e.id}">Remove link</button>`;
    return;
  }
  const n = ui.sel && state.plan.nodes[ui.sel.id];
  if (!n) {
    const s = state.run, p = state.plan;
    el.innerHTML = `<h3>Factory</h3><div class="help">Click a node to set it up and drive its copies. Click a verdict chip (like <b>done →</b>) and then another node to link them. Drag a node by its head. Click a link's label to cap its loop.</div>
      <div class="field"><span>Steward may edit this plan</span>${seg('plan', 'steward-edits', p.stewardEdits ? 'yes' : 'no', ['yes', 'no'])}<span class="help">${p.stewardEdits ? 'The Steward may add, remove, set, link, unlink, loop, move and name.' : 'The Steward only steers the run: resume, adopt, discard, and open a gate whose opener is steward.'}</span></div>
      <hr class="sep"><h3>Run</h3><table>
      <tr><th>Nodes</th><td>${Object.keys(p.nodes).length}</td></tr>
      <tr><th>Running</th><td>${Object.values(s.nodes).filter(r => r.status === 'running').length}</td></tr>
      <tr><th>Waiting handoffs</th><td>${Object.entries(s.nodes).filter(([, r]) => Object.keys(r.parked).length).map(([id]) => esc(id)).join(', ') || '—'}</td></tr>
      <tr><th>Held spawns</th><td>${s.held.length}</td></tr>
      <tr><th>Spent loops</th><td>${s.spent.length}</td></tr>
      <tr><th>Finished</th><td>${s.finished ? 'yes' : Object.values(s.nodes).some(r => r.status === 'holding') ? 'Finish is waiting' : 'no'}</td></tr></table>`;
    return;
  }
  const kind = K[n.kind], r = state.run.nodes[n.id];
  let cfg = `<h3>${kind.label} · ${esc(n.id)}</h3>
    <label class="field"><span>Title</span><input id="f-title" data-field="title" value="${esc(n.title)}"></label>`;
  const runsOn = () => `<label class="field"><span>Skill (driver)</span><input id="f-skill" data-field="skill" value="${esc(n.skill)}"></label>
      ${['harness', 'model', 'effort'].map(f => `<label class="field"><span>${f[0].toUpperCase() + f.slice(1)}</span><input id="f-${f}" data-field="${f}" value="${esc(n[f])}" list="dl-${f}">
        <div class="quick">${Horde.SUGGEST[f].map(c => `<button type="button" class="${c === n[f] ? 'on' : ''}" data-cmd="set ${n.id} ${f} ${c}">${c}</button>`).join('')}</div></label>`).join('')}`;
  if (Horde.isAgent(n.kind)) {
    const m = Horde.mergerOf(state, n.id);
    const per = n.copies.mode === 'per-item';
    cfg += runsOn() + `
      <div class="field"><span>May it spawn follow-up work?</span>${seg(n.id, 'spawn', n.spawn, Horde.ENUMS.spawn)}<span class="help">${HELP.spawn[n.spawn]}</span></div>
      <div class="field"><span>When a copy checkpoints</span>${seg(n.id, 'checkpoint', n.checkpoint, Horde.ENUMS.checkpoint)}<span class="help">${HELP.checkpoint[n.checkpoint]}</span></div>
      <div class="field"><span>Copies</span><div class="row"><div class="seg"><button class="${per ? '' : 'on'}" data-cmd="set ${n.id} copies one">one</button><button class="${per ? 'on' : ''}" data-cmd="set ${n.id} copies per-item:${per ? n.copies.n : 3}">per-item</button></div>
        ${per ? `<span class="dim">at once</span><input type="number" min="1" id="f-copies-n" value="${n.copies.n === 'all' ? '' : n.copies.n}" placeholder="all" style="width:4.5em" data-copies="1" title="How many copies run at once"><button class="${n.copies.n === 'all' ? 'on' : ''}" data-cmd="set ${n.id} copies per-item:all">all</button>` : ''}</div>
        <span class="help">${per ? `One copy per item handed in (slices, tickets, findings), ${n.copies.n === 'all' ? 'all at once' : `at most ${n.copies.n} at once; the rest queue and start as copies finish`}. Never two copies on the same item.` : 'One copy, whatever it is handed.'}</span></div>
      ${per ? `<div class="field"><span>Merger</span>${seg(n.id, 'merge', n.merge, Horde.ENUMS.merge)}<span class="help">${m ? `${esc(m.id)} folds every branch into the line base. Remove it or set merge off to let the branches travel on separately.` : 'No merger: the branches travel on separately.'}</span></div>` : ''}`;
  } else if (kind.merger) {
    cfg += runsOn() + `
      <div class="field"><span>On a conflict</span>${seg(n.id, 'conflict', n.conflict, Horde.ENUMS.conflict)}<span class="help">${HELP.conflict[n.conflict]}</span></div>
      <div class="help">Merges ${n.of ? `the branches of <b>${esc(n.of)}</b>` : 'the branches of whatever links into it'} into the line base. A single branch passes through.</div>`;
  } else if (kind.gate) {
    cfg += `<div class="field"><span>Who opens it</span>${seg(n.id, 'open', n.open, Horde.ENUMS.open)}<span class="help">${HELP.open[n.open]}</span></div>
      <div class="field"><span>Inputs</span>${seg(n.id, 'join', n.join, Horde.ENUMS.join)}<span class="help">${n.join === 'all' ? 'Waits until every incoming link has delivered.' : 'Any one incoming link is enough.'}</span></div>`;
  } else if (kind.terminal) {
    cfg += `<div class="help">Reaching Finish ends the run only once nothing else is running, queued, at a checkpoint, held, spent or waiting at a closed gate.</div>`;
  }
  if (kind.verdicts.length) {
    const outs = state.plan.edges.filter(e => e.from === n.id);
    const others = Object.values(state.plan.nodes).filter(o => o.id !== n.id);
    cfg += `<hr class="sep"><h3>Links: what comes next</h3><div class="links">
      ${outs.map(e => `<div class="linkrow"><span>says <b>${esc(e.on)}</b> → ${esc(state.plan.nodes[e.to].title)}${e.max != null ? ` <span class="dim">· cap ${e.max}${e.steward ? ' · Steward +1' : ''}</span>` : ''}</span><span><button data-ui="sel-edge" data-edge="${esc(e.id)}">Edit</button> <button data-cmd="unlink ${e.id}">✕</button></span></div>`).join('') || `<span class="help">Nothing follows yet. Whatever it hands over will wait on it until you link a next step.</span>`}
      ${others.length ? `<div class="addlink"><span class="dim">when it says</span><select id="link-on">${kind.verdicts.map(v => `<option>${v}</option>`).join('')}</select><span class="dim">go to</span><select id="link-to">${others.map(o => `<option value="${o.id}">${esc(o.title)} (${o.id})</option>`).join('')}</select><button class="primary" data-ui="add-link" data-id="${n.id}">Link</button></div>` : `<span class="help">Put another node down to link to it.</span>`}
      <span class="help">On the canvas: click a verdict chip like <b>${esc(kind.verdicts[0])} →</b>, then click the next node.</span></div>`;
  }
  let runHtml = `<hr class="sep"><h3>This run</h3>`;
  if (Horde.isAgent(n.kind)) {
    const canRun = !(r && (r.copies.some(c => Horde.ACTIVE.includes(c.status)) || r.queue.length));
    runHtml += `<div class="row"><button class="primary" ${canRun ? '' : 'disabled'} data-ui="run-node" data-id="${n.id}">Run this node</button><span class="help">uses the opening prompt</span></div>`;
  } else if (kind.merger) {
    runHtml += `<div class="row"><button data-cmd="conflict ${n.id}" ${r && r.armed ? 'disabled' : ''}>Next merge conflicts</button><span class="help">${r && r.armed ? 'armed: the next merge of two or more branches conflicts' : 'free play: there is no real git here'}</span></div>`;
  }
  if (r) {
    runHtml += `<div class="help">Pass ${r.pass} · ${esc(nodeState(n.id).text)}${r.input && r.input.items && r.input.items.length ? ` · handed: ${esc(r.input.items.join(', '))}` : ''}${r.inbox.length ? ` · ${r.inbox.length} in inbox` : ''}</div>`;
    if (r.queue.length || (Horde.isAgent(n.kind) && n.copies.mode === 'per-item' && r.copies.length)) runHtml += `<div class="help"><b>${liveCount(r)} running · ${r.queue.length} queued</b>${r.queue.length ? `: ${esc(r.queue.join(', '))}` : ''}</div>`;
    if (r.status === 'holding') runHtml += `<div class="tone-warn">Waiting for: ${esc(r.waitingFor.join(', '))}. It completes by itself once these clear.</div>`;
    for (const [v, p] of Object.entries(r.parked)) runHtml += `<div class="tone-park">Waiting handoff on "${esc(v)}": ${esc(p.items.join(', ') || 'no items')}. Link ${esc(v)} → somewhere to pass it on.</div>`;
    if (r.status === 'waiting') runHtml += `<button class="primary" data-cmd="open ${n.id}">Open gate</button>`;
    for (const c of r.copies) {
      const live = c.status === 'running';
      const makes = v => (kind.makes[v] != null ? kind.makes[v] : 0);
      runHtml += `<div class="copyrow"><div class="top"><b>${esc(c.id)}${c.spawned ? ' <span class="tone-steward">spawned</span>' : ''}${c.resolver ? ' <span class="tone-warn">resolver</span>' : ''}</b><span class="state ${c.status === 'checkpoint' ? 'needs' : c.status === 'done' ? 'done' : c.status === 'running' ? 'running' : ''}">${c.status}${c.verdict ? ` · ${c.verdict}` : ''}</span></div>
        <div class="help">${c.item ? `works on: ${esc(c.item)}` : 'works on: the opening prompt'}${c.out && c.out.length ? ` · hands on: ${esc(c.out.join(', '))}` : ''}</div>
        ${live ? `<div class="acts">${kind.verdicts.map(v => `<button data-ui="finish" data-copy="${c.id}" data-verdict="${v}">${v}</button>`).join('')}
          ${kind.merger ? '' : `<label class="dim" title="How many items this verdict hands on (slices, findings). 0 passes on what it was given.">items <input type="number" min="0" id="items-${esc(c.id)}" value="${makes(kind.verdicts.find(v => kind.makes[v]) || kind.verdicts[0])}"></label>`}</div>
          <div class="acts"><button data-cmd="checkpoint ${c.id}">Checkpoint</button>${kind.merger ? '' : `<button data-ui="spawn" data-copy="${c.id}">Propose spawn</button>`}<button data-cmd="close ${c.id}">Close</button></div>` : ''}
        ${c.status === 'checkpoint' || c.status === 'resting' ? `<div class="acts"><button data-cmd="resume ${c.id}">Resume</button><button data-cmd="close ${c.id}">Close</button></div>` : ''}</div>`;
    }
  }
  el.innerHTML = cfg + runHtml + `<hr class="sep"><button class="warn" data-cmd="remove ${n.id}">Remove node</button>`;
}

const TABS = [['walk', 'Walkthroughs'], ['agent', 'Agent'], ['file', 'Plan file'], ['state', 'State'], ['log', 'Log'], ['about', 'What this answers']];
function renderDrawer() {
  $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="${ui.tab === k ? 'on' : ''}" data-ui="tab" data-tab="${k}">${l}</button>`).join('');
  const p = $('pane');
  if (ui.tab === 'walk') {
    const w = WALKS[ui.walk];
    p.innerHTML = `<div class="wt"><div class="wt-list">${WALKS.map((x, i) => `<button class="${i === ui.walk ? 'on' : ''}" data-ui="walk" data-i="${i}">${esc(x.title)}</button>`).join('')}</div>
      <div class="wt-body"><p>${esc(w.desc)}</p><p class="row"><button data-ui="walk-reset">Start this walkthrough again</button><span class="dim">Each step is the same command an agent would send.</span></p>
      <div class="steps">${w.steps.map(([label, cmd], i) => `<div class="step ${i < ui.step ? 'done' : i === ui.step ? 'next' : ''}"><span class="n">${i + 1}</span><button ${i === ui.step ? '' : 'disabled'} data-ui="step" data-i="${i}">${esc(label)}<code>${esc(cmd)}</code></button></div>`).join('')}</div>
      ${ui.step >= w.steps.length ? `<p class="tone-good" style="margin-top:8px">Done. Keep poking at it with free play, or try the next walkthrough.</p>` : ''}</div></div>`;
  } else if (ui.tab === 'agent') {
    p.innerHTML = `<div class="grid2"><div><p class="dim" style="margin-top:0">An agent changes the plan and drives the run with the same commands every button sends. Type one and press Enter.</p>
      <div class="row" style="margin-bottom:6px"><span class="dim">Send as</span><div class="seg">${['you', 'Steward'].map(v => `<button class="${ui.sendAs === v ? 'on' : ''}" data-ui="send-as" data-as="${v}">${v}</button>`).join('')}</div>
        <span class="help">${ui.sendAs === 'Steward' ? `Sent as <code>as steward: …</code>. ${state.plan.stewardEdits ? 'This plan lets the Steward edit it.' : 'Plan edits are refused; it may resume, adopt, discard, or open a steward gate.'}` : 'Sent as you: anything goes.'}</span></div>
      <form class="agent-in" id="agent-form"><input id="agent-line" placeholder='set builder spawn ask' autocomplete="off"><button class="primary">Send</button></form>
      ${state.notice ? `<p class="notice">✕ ${esc(state.notice)}</p>` : ''}
      <p class="dim">Last commands sent (by you, the Steward or the buttons):</p><div class="log">${state.log.slice(-6).reverse().map(e => `<div class="e"><code class="${/^as steward:/.test(e.cmd || '') ? 'tone-steward' : ''}">${esc(e.cmd)}</code></div>`).join('')}</div></div>
      <div><table><tr><th>Lay out</th><td><code>add builder as fixer at 340 60 "Fixer"</code><br><code>link review.findings -> fixer max 2</code><br><code>set fixer copies per-item:4</code> · <code>per-item:all</code> · <code>one</code><br><code>set fixer spawn ask</code> · <code>set fixer checkpoint rest</code><br><code>set fixer harness cursor</code> · <code>set fixer model composer-2</code><br><code>set fixer merge off</code> · <code>set fixer-merge conflict wait</code><br><code>loop review.findings>fixer max 3</code> · <code>loop … steward yes</code><br><code>remove fixer</code> · <code>unlink e</code></td></tr>
      <tr><th>Plan</th><td><code>set plan steward-edits yes</code> · <code>set plan note "…"</code><br><code>as steward: set fixer model sonnet</code></td></tr>
      <tr><th>Run</th><td><code>run grill "prompt"</code> · <code>run all</code><br><code>finish grill#1.1 done items 3</code><br><code>checkpoint builder#1.2</code> · <code>resume</code> · <code>close</code> · <code>tick</code><br><code>spawn builder#1.1 "what"</code> · <code>adopt h1</code> · <code>discard h1</code><br><code>conflict builder-merge</code> · <code>finish builder-merge#1.1 merged</code><br><code>open approve</code> · <code>allow e</code> · <code>stop e</code></td></tr>
      <tr><th>Files</th><td><code>save "My setup"</code> · <code>preset Matt Pocock · Main</code> · <code>new</code> · <code>name "x"</code></td></tr></table></div></div>`;
  } else if (ui.tab === 'file') {
    const pl = state.plan;
    p.innerHTML = `<div class="grid2"><div><p class="dim" style="margin-top:0">This is the whole saved factory: a small JSON file you can keep in git. Edit it and load it back, or paste one in.</p>
      <textarea class="json" id="file-text" spellcheck="false">${esc(JSON.stringify(Horde.toFile(state), null, 2))}</textarea>
      <div class="row"><button data-ui="copy-file">Copy</button><button data-ui="load-file">Load from text</button><span id="file-msg" class="dim"></span></div></div>
      <div>${pl.source || pl.note ? `<table class="about-plan"><tr><th>Author</th><td>${esc(pl.author || '—')}</td></tr><tr><th>Source</th><td><code>${esc(pl.source || '—')}</code></td></tr><tr><th>Note</th><td>${esc(pl.note || '—')}</td></tr></table>` : ''}
      <div class="row" style="margin:8px 0"><span class="dim">Steward may edit this plan</span>${seg('plan', 'steward-edits', pl.stewardEdits ? 'yes' : 'no', ['yes', 'no'])}</div>
      ${ui.justSaved ? `<p class="saved" style="margin-top:0">Saved "${esc(ui.justSaved)}" as a preset. In the real thing this writes the plan file on the left into the repo, e.g. <code>.horde/${esc(ui.justSaved.toLowerCase().replace(/[^a-z0-9]+/g, '-'))}.json</code>.</p>` : ''}<p class="dim" style="margin-top:0">Presets in this session (not saved anywhere: it is a prototype).</p>
      <div class="row"><input id="save-name" placeholder="Name for this setup" value="${esc(pl.name)}"><button class="primary" data-ui="save-preset">Save as preset</button></div>
      <table style="margin-top:8px">${Object.entries(presetGroups()).map(([author, names]) => `<tr><th colspan="3">${esc(author)}</th></tr>` + names.map(name => { const f = state.presets[name]; return `<tr><td>${esc(name)}</td><td class="dim">${f.nodes.length} nodes · ${f.edges.length} links</td><td><button data-cmd='preset ${esc(name)}'>Load</button></td></tr>`; }).join('')).join('')}</table></div></div>`;
  } else if (ui.tab === 'state') {
    const rows = Object.values(state.plan.nodes).map(n => {
      const r = state.run.nodes[n.id];
      return `<tr><td>${esc(n.id)}</td><td>${esc(nodeState(n.id).text)}</td><td>${r ? r.pass : 0}</td><td>${r ? r.copies.map(c => `${esc(c.id)} ${c.status}`).join('<br>') : '—'}</td><td>${r ? r.queue.length : 0}</td><td>${r ? Object.entries(r.parked).map(([v, p]) => `${v}: ${esc(p.items.join(', ') || '—')}`).join('<br>') || '—' : '—'}</td><td>${r ? r.inbox.length : 0}</td></tr>`;
    }).join('');
    const erows = state.plan.edges.map(e => { const st = state.run.edges[e.id]; return `<tr><td>${esc(e.id)}</td><td>${st?.count || 0}</td><td>${e.max == null ? 'no cap' : `${e.max}${st && st.extra ? ` +${st.extra}` : ''}`}</td><td>${e.steward ? 'Steward +1' : ''}</td><td>${state.run.spent.some(x => x.edge === e.id) ? '<span class="tone-refuse">spent, waiting</span>' : ''}</td></tr>`; }).join('');
    p.innerHTML = `<div class="grid2"><div style="overflow-x:auto"><table><tr><th>Node</th><th>State</th><th>Pass</th><th>Copies</th><th>Queued</th><th>Waiting handoff</th><th>Inbox</th></tr>${rows}</table></div>
      <div style="overflow-x:auto"><table><tr><th>Link</th><th>Used</th><th>Cap</th><th></th><th></th></tr>${erows}</table>
      <p class="dim">Held spawns: ${state.run.held.map(h => `${esc(h.id)} (${esc(h.what)})`).join(', ') || 'none'} · clock ${state.run.clock} · Steward edits: ${state.plan.stewardEdits ? 'yes' : 'no'} · prompt: ${esc(state.run.prompt || '—')}</p></div></div>`;
  } else if (ui.tab === 'log') {
    p.innerHTML = `<div class="log">${state.log.slice().reverse().map(e => `<div class="e"><code class="${/^as steward:/.test(e.cmd || '') ? 'tone-steward' : ''}">› ${esc(e.cmd)}</code>${e.lines.map(l => `<div class="l tone-${l.tone}">${esc(l.text)}</div>`).join('')}</div>`).join('') || '<span class="dim">Nothing yet.</span>'}</div>`;
  } else {
    p.innerHTML = `<div class="qa"><p><b>Question.</b> If the Factory stops being a fixed run of Stations and becomes a plan you lay out yourself, does this model hold together? A plan is nodes and links. Each node says whether it may spawn (no, ask, yes), what happens when a copy checkpoints (wait, Steward, continue, rest), and whether it runs one copy or one copy per item handed in. Copies split one plan into chunks and never duplicate work: a cap says how many run at once, the rest queue and start in waves. A node that runs per item gets its own merger node, which folds the branches into the line base and runs a resolver (or waits for you) on a conflict. Links carry a verdict, and loops always carry a cap. Gates join inputs and wait for someone to open them. Finish waits until nothing else is running.</p>
      <p><b>v3 settles:</b> no best-of-N; the merger as a node you can remove; Finish waiting for everything else; the Steward's plan edits opt-in per plan, and an opt-in extra pass per loop; presets that follow each author's own recommended flow, with the source file and a note on what the graph cannot say.</p>
      <p><b>Not modelled:</b> real agents, real git (conflicts are armed by hand), spawn caps, the Grill as a Conversation, Prove checking merged work, persistence. ADR-0037 rejected a user-defined Station graph; this prototype tests whether reversing it is worth it.</p></div>`;
  }
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-cmd],[data-ui],[data-node],[data-edge]');
  if (!t) return;
  if (t.dataset.cmd) { if (ui.linking) ui.linking = null; return send(t.dataset.cmd); }
  const u = t.dataset.ui;
  if (u === 'port') { const [from, on] = t.dataset.port.split('.'); ui.linking = ui.linking && ui.linking.from === from && ui.linking.on === on ? null : { from, on }; ev.stopPropagation(); return render(); }
  if (u === 'tab') { ui.tab = t.dataset.tab; ui.justSaved = null; return renderDrawer(); }
  if (u === 'send-as') { ui.sendAs = t.dataset.as; return renderDrawer(); }
  if (u === 'walk') { ui.walk = +t.dataset.i; return startWalk(); }
  if (u === 'walk-reset') return startWalk();
  if (u === 'step') { const [, cmd] = WALKS[ui.walk].steps[+t.dataset.i]; ui.step++; return send(cmd); }
  if (u === 'run-node') return send(`run ${t.dataset.id} "${($('prompt').value || '').replace(/"/g, "'")}"`);
  if (u === 'finish') {
    const inp = document.getElementById(`items-${t.dataset.copy}`);
    const n = inp ? Math.max(0, parseInt(inp.value || '0', 10)) : null;
    return send(`finish ${t.dataset.copy} ${t.dataset.verdict}${n == null ? '' : ` items ${n}`}`);
  }
  if (u === 'spawn') { const what = ['Fix a flaky test', 'Add a missing migration', 'Tidy the error messages', 'Write docs for the new flag'][Math.floor(Math.random() * 4)]; return send(`spawn ${t.dataset.copy} "${what}"`); }
  if (u === 'edge-max') { const v = $('edge-max').value; return send(`loop ${t.dataset.edge} max ${v === '' ? 'none' : v}`); }
  if (u === 'copy-file') { const txt = $('file-text').value; navigator.clipboard?.writeText(txt).then(() => { $('file-msg').textContent = 'Copied.'; }, () => { $('file-text').select(); $('file-msg').textContent = 'Selected; press Ctrl+C.'; }); return; }
  if (u === 'load-file') { try { dispatch({ type: 'load', file: JSON.parse($('file-text').value) }); } catch (err) { $('file-msg').textContent = 'That is not valid JSON: ' + err.message; } return; }
  if (u === 'add-link') return send(`link ${t.dataset.id}.${$('link-on').value} -> ${$('link-to').value}`);
  if (u === 'sel-edge') { ui.sel = { kind: 'edge', id: t.dataset.edge }; return render(); }
  if (u === 'save-now') { send(`save ${JSON.stringify(state.plan.name.replace(/"/g, "'"))}`); ui.tab = 'file'; ui.justSaved = state.plan.name; return renderDrawer(); }
  if (u === 'save-preset') return send(`save "${($('save-name').value || state.plan.name).replace(/"/g, "'")}"`);
  if (t.dataset.edge && !t.dataset.ui && !t.dataset.cmd) { ui.sel = { kind: 'edge', id: t.dataset.edge }; return render(); }
  if (t.dataset.node) {
    if (ui.linking) { const { from, on } = ui.linking; ui.linking = null; if (from !== t.dataset.node) return send(`link ${from}.${on} -> ${t.dataset.node}`); return render(); }
    if (dragMoved) return;
    ui.sel = { kind: 'node', id: t.dataset.node }; return render();
  }
});
$('canvas-wrap').addEventListener('click', ev => { if (ev.target.id === 'canvas' || ev.target.id === 'canvas-wrap' || ev.target.tagName === 'svg') { ui.sel = null; ui.linking = null; render(); } });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ui.linking) { ui.linking = null; render(); } });
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.field && ui.sel) send(`set ${ui.sel.id} ${t.dataset.field} "${t.value.replace(/"/g, "'")}"`);
  if (t.dataset.copies && ui.sel) send(`set ${ui.sel.id} copies per-item:${t.value === '' ? 'all' : Math.max(1, parseInt(t.value, 10) || 1)}`);
  if (t.id === 'plan-name') send(`name "${t.value.replace(/"/g, "'")}"`);
  if (t.id === 'preset' && t.value) send(`preset ${t.value}`);
  if (t.id === 'prompt') state.run.prompt = t.value;
});
document.addEventListener('submit', ev => {
  if (ev.target.id !== 'agent-form') return;
  ev.preventDefault();
  const line = $('agent-line').value.trim();
  if (line) send(ui.sendAs === 'Steward' && !/^as\s+steward:/i.test(line) ? `as steward: ${line}` : line);
  ui.tab = 'agent'; renderDrawer();
  setTimeout(() => $('agent-line')?.focus(), 0);
});
$('prompt').addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $('run-all').click(); }
});
$('run-all').addEventListener('click', () => send(`run all "${($('prompt').value || '').replace(/"/g, "'")}"`));

/* drag a card by its head */
let drag = null, dragMoved = false;
document.addEventListener('pointerdown', ev => {
  const h = ev.target.closest('[data-drag]');
  if (!h || ui.linking) return;
  const card = h.parentElement;
  drag = { id: h.dataset.drag, card, sx: ev.clientX, sy: ev.clientY, x: card.offsetLeft, y: card.offsetTop };
  dragMoved = false;
});
document.addEventListener('pointermove', ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
  if (!dragMoved) return;
  drag.card.style.left = Math.max(0, drag.x + dx) + 'px';
  drag.card.style.top = Math.max(0, drag.y + dy) + 'px';
  drawEdges();
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  if (dragMoved) dispatch({ type: 'move', id: drag.id, x: drag.card.offsetLeft, y: drag.card.offsetTop, quiet: true });
  drag = null;
  setTimeout(() => { dragMoved = false; }, 0);
});

function startWalk() {
  const w = WALKS[ui.walk];
  let s = Horde.empty('Walkthrough', state.presets);
  s = Horde.run(s, w.setup);
  s.log = [{ cmd: `— walkthrough: ${w.title} —`, lines: [] }];
  s.notice = null; s.changed = [];
  state = s; ui.step = 0; ui.sel = null; ui.linking = null;
  render();
}

startWalk();
</script>
