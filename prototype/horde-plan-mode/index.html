<title>Horde Plan Mode</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the Console's own canvas. Header bar, a node shelf, the canvas,
   an inspector on the right, and a tabbed drawer underneath.
   PROTOTYPE: throwaway. The Horde module in the first script block is the part
   worth keeping. */
:root {
  --bg: #0b0e14;
  --bg-panel: #12161f;
  --bg-panel-2: #1a2030;
  --border: #232a3b;
  --text: #d4dae4;
  --text-dim: #7d8597;
  --accent: #4cc2ff;
  --accent-purple: #a371f7;
  --steward: #db61a2;
  --pending: #8b949e;
  --running: #d29922;
  --done: #3fb950;
  --interrupt: #f85149;
  --mono: ui-monospace, "Liberation Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--mono);
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--bg-panel-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 9px;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); color: #06121c; border-color: var(--accent); font-weight: 700; }
button.warn { border-color: var(--interrupt); color: var(--interrupt); }
input, select, textarea {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 6px;
  min-width: 0;
}
.dim { color: var(--text-dim); }
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto auto 1fr minmax(220px, 34%);
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}

/* Header */
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding: 8px max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
}
.brand { font-weight: 700; letter-spacing: .04em; }
.brand span { color: var(--accent-purple); font-weight: 400; margin-left: 6px; text-transform: uppercase; font-size: 11px; letter-spacing: .12em; }
#plan-name { width: 14em; }
#prompt { flex: 1 1 18em; resize: none; height: 28px; line-height: 1.45; transition: height .12s; }
#prompt:focus, #prompt.tall { height: 7.5em; resize: vertical; position: relative; z-index: 20; }
@media (prefers-reduced-motion: reduce) { #prompt { transition: none; } }
.quick { display: flex; flex-wrap: wrap; gap: 3px; }
.quick button { font-size: 11px; padding: 0 6px; border-radius: 10px; }
.quick button.on { border-color: var(--accent); color: var(--accent); }
.links { display: grid; gap: 4px; }
.linkrow { display: flex; gap: 6px; align-items: center; justify-content: space-between; border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px 2px 8px; font-size: 12px; }
.linkrow button { font-size: 11px; padding: 0 6px; }
.addlink { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.addlink select { max-width: 9.5em; }
.port.open { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
.saved { color: var(--done); }
.preset-line { flex-basis: 100%; font-size: 11.5px; color: var(--text-dim); max-width: 160ch; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.preset-line[hidden] { display: none; }
.preset-line b { color: var(--text); font-weight: 400; }
.preset-line code { color: var(--accent); }
.clock { color: var(--text-dim); font-variant-numeric: tabular-nums; }

/* Needs-you tray */
.tray {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  padding: 6px 16px; min-height: 36px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.tray .label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); }
.ask {
  display: inline-flex; gap: 6px; align-items: center;
  border: 1px solid var(--interrupt); border-radius: 4px; padding: 2px 4px 2px 8px;
  background: color-mix(in srgb, var(--interrupt) 8%, transparent);
}
.ask.held { border-color: var(--steward); background: color-mix(in srgb, var(--steward) 8%, transparent); }
.ask button { padding: 1px 7px; font-size: 12px; }
.notice { color: var(--interrupt); }

/* Main row */
main { display: grid; grid-template-columns: 132px 1fr 330px; min-height: 0; }
.shelf { border-right: 1px solid var(--border); padding: 10px; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
.shelf h3, .insp h3 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); font-weight: 400; }
.shelf button { text-align: left; }
.shelf .k { display: block; font-size: 10px; color: var(--text-dim); }
.canvas-wrap { overflow: auto; position: relative; min-width: 0; }
.canvas { position: relative; width: 2120px; height: 560px; }
.canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.canvas svg .elabel { pointer-events: all; cursor: pointer; }
.empty-hint { position: absolute; left: 40px; top: 60px; max-width: 34em; color: var(--text-dim); border: 1px dashed var(--border); border-radius: 6px; padding: 16px; }
.linking-banner { position: sticky; left: 0; top: 0; z-index: 5; background: var(--accent); color: #06121c; padding: 4px 12px; font-weight: 700; }

/* Cards, after .node-card in the Console */
.card {
  position: absolute; width: 210px;
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px;
  user-select: none;
}
.card.k-grill { border-left: 3px solid var(--accent-purple); }
.card.k-merger { border-left: 3px solid var(--accent); }
.card.s-running, .card.s-collecting { border-color: var(--running); }
.card.s-needs { border-color: var(--interrupt); box-shadow: 0 0 0 1px var(--interrupt); }
.card.s-parked { border-color: var(--accent); border-style: dashed; }
.card.s-done { opacity: .62; }
.card.s-halted { border-color: var(--interrupt); opacity: .7; }
.card.sel { box-shadow: 0 0 0 3px var(--accent); }
.card.changed .head { background: color-mix(in srgb, var(--accent) 16%, var(--bg-panel-2)); }
.card.linkable:hover { box-shadow: 0 0 0 2px var(--accent); cursor: crosshair; }
.head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
  background: var(--bg-panel-2); padding: 6px 10px; border-radius: 6px 6px 0 0; cursor: grab;
}
.head .id { font-weight: 700; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.state { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.state.running, .state.collecting { color: var(--running); }
.state.needs, .state.halted { color: var(--interrupt); }
.state.parked { color: var(--accent); }
.state.done { color: var(--done); }
.body { padding: 7px 10px 8px; font-size: 12px; display: grid; gap: 5px; }
.badge { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; outline: 1px solid var(--accent-purple); color: var(--accent-purple); border-radius: 3px; padding: 0 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 10.5px; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; color: var(--text-dim); }
.chip.on { color: var(--text); }
.chip.spawn-yes { color: var(--done); border-color: color-mix(in srgb, var(--done) 40%, var(--border)); }
.chip.spawn-ask { color: var(--steward); border-color: color-mix(in srgb, var(--steward) 40%, var(--border)); }
.chip.merge { color: var(--accent); }
.copies { display: flex; gap: 3px; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pending); }
.dot.running { background: var(--running); }
.dot.done { background: var(--done); }
.dot.checkpoint, .dot.closed { background: var(--interrupt); }
.dot.resting { background: var(--accent-purple); }
.dot.spawned { outline: 1px solid var(--steward); outline-offset: 1px; }
.dot.queued { background: none; border: 1px dashed var(--pending); }
.chip.armed { color: var(--interrupt); border-color: color-mix(in srgb, var(--interrupt) 50%, var(--border)); }
.waitfor { font-size: 11px; color: var(--running); }
.ports { display: flex; gap: 4px; flex-wrap: wrap; border-top: 1px solid var(--border); padding: 5px 8px; }
.port { font-size: 11px; padding: 0 6px; border-radius: 10px; background: var(--bg); }
.port.parked { border-color: var(--accent); color: var(--accent); }
.port.parked::after { content: " ● waiting"; }
.port.armed { background: var(--accent); color: #06121c; }

/* Inspector */
.insp { border-left: 1px solid var(--border); padding: 10px 12px; overflow: auto; display: grid; align-content: start; gap: 12px; }
.field { display: grid; gap: 3px; }
.field > span { font-size: 11px; color: var(--text-dim); }
.seg { display: flex; flex-wrap: wrap; gap: 0; }
.seg button { border-radius: 0; margin-left: -1px; padding: 2px 8px; font-size: 12px; }
.seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
.seg button:last-child { border-radius: 0 4px 4px 0; }
.seg button.on { background: var(--accent); color: #06121c; border-color: var(--accent); position: relative; }
.help { font-size: 11px; color: var(--text-dim); }
.copyrow { border: 1px solid var(--border); border-radius: 4px; padding: 6px; display: grid; gap: 5px; }
.copyrow .top { display: flex; justify-content: space-between; gap: 6px; }
.copyrow .acts { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.copyrow .acts button { font-size: 11.5px; padding: 1px 6px; }
.copyrow input[type=number] { width: 4.2em; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sep { border: 0; border-top: 1px solid var(--border); margin: 0; width: 100%; }

/* Drawer */
.drawer { border-top: 1px solid var(--border); display: grid; grid-template-rows: auto 1fr; min-height: 0; background: var(--bg-panel); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { border: 0; border-radius: 0; background: none; padding: 6px 14px; color: var(--text-dim); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.pane { overflow: auto; padding: 10px max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 0; }
.wt { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
.wt-list { display: grid; align-content: start; gap: 4px; }
.wt-list button { text-align: left; }
.wt-list button.on { border-color: var(--accent); color: var(--accent); }
.wt-body p { margin: 0 0 8px; max-width: 70ch; }
.steps { display: grid; gap: 4px; }
.step { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.step .n { color: var(--text-dim); text-align: right; font-variant-numeric: tabular-nums; padding-top: 3px; }
.step button { text-align: left; width: 100%; }
.step button code { color: var(--text-dim); font-size: 11px; display: block; }
.step.done button { opacity: .5; }
.step.next button { border-color: var(--accent); }
.log { display: grid; gap: 6px; }
.log .e code { color: var(--accent); }
.log .l { padding-left: 14px; }
.tone-warn { color: var(--running); }
.tone-refuse { color: var(--interrupt); }
.tone-steward { color: var(--steward); }
.tone-good { color: var(--done); }
.tone-park { color: var(--accent); }
.agent-in { display: flex; gap: 6px; }
.agent-in input { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid2 > * { min-width: 0; }
textarea.json { width: 100%; height: 190px; resize: vertical; font-size: 11.5px; }
table { border-collapse: collapse; font-size: 12px; }
td, th { border-bottom: 1px solid var(--border); padding: 3px 10px 3px 0; text-align: left; vertical-align: top; }
th { color: var(--text-dim); font-weight: 400; }
.qa { max-width: 80ch; }
.qa p { margin: 0 0 8px; }

@media (max-width: 900px) {
  .app { grid-template-rows: auto auto minmax(420px, 1fr) auto auto; height: auto; }
  main { grid-template-columns: 1fr; }
  .shelf { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--border); }
  .canvas-wrap { height: 460px; }
  .insp { border-left: 0; border-top: 1px solid var(--border); }
  .drawer { min-height: 420px; }
  .wt, .grid2 { grid-template-columns: 1fr; }
}
</style>

<div class="app">
  <header>
    <div class="brand">HORDE<span>plan mode · prototype</span></div>
    <input id="plan-name" aria-label="Factory name">
    <select id="preset" aria-label="Load a preset"></select>
    <button data-cmd="new">New empty factory</button>
    <button data-ui="save-now" title="Save this layout as a preset and show its plan file">Save</button>
    <textarea id="prompt" rows="1" placeholder="Opening prompt for the first node… (Shift+Enter for a new line)" aria-label="Opening prompt"></textarea>
    <button class="primary" id="run-all">Run</button>
    <button data-cmd="reset run" title="Keep the layout, clear the run">Reset run</button>
    <span class="clock" id="clock"></span>
    <button data-cmd="tick" title="Advance the clock: resting copies wake (e.g. usage limit reset)">Tick clock</button>
    <div class="preset-line" id="preset-line" hidden></div>
  </header>
  <div class="tray" id="tray"></div>
  <main>
    <div class="shelf" id="shelf"></div>
    <div class="canvas-wrap" id="canvas-wrap"><div class="canvas" id="canvas"></div></div>
    <div class="insp" id="insp"></div>
  </main>
  <div class="drawer">
    <div class="tabs" id="tabs"></div>
    <div class="pane" id="pane"></div>
  </div>
</div>

<datalist id="dl-harness"><option>claude</option><option>codex</option><option>cursor</option><option>opencode</option></datalist>
<datalist id="dl-model"><option>opus</option><option>sonnet</option><option>haiku</option><option>gpt-5.5</option><option>composer-2</option></datalist>
<datalist id="dl-effort"><option>low</option><option>medium</option><option>high</option><option>xhigh</option></datalist>

<script>
/* ============================================================
   Horde: the plan-mode model. Pure; no DOM. Lift this out.
   reduce(state, action) -> state; parse(line) -> action;
   toCommand(action) -> line. The UI and an agent both speak
   through parse/toCommand, so anything one can do the other can.
   ============================================================ */
const Horde = (() => {
  const KINDS = {
    grill:   { label: 'Grill',   verdicts: ['done'], noun: 'slice', makes: { done: 3 }, cfg: { harness: 'claude', skill: 'my-grill-with-docs', model: 'opus', effort: 'high', spawn: 'no', checkpoint: 'wait', copies: { mode: 'one', n: 1 }, merge: 'auto' } },
    agent:   { label: 'Agent',   verdicts: ['done'], noun: 'item', makes: {}, cfg: { harness: 'claude', skill: '', model: 'sonnet', effort: 'medium', spawn: 'ask', checkpoint: 'wait', copies: { mode: 'one', n: 1 }, merge: 'auto' } },
    builder: { label: 'Builder', verdicts: ['done'], noun: 'item', makes: {}, cfg: { harness: 'claude', skill: 'tdd', model: 'opus', effort: 'high', spawn: 'ask', checkpoint: 'steward', copies: { mode: 'per-item', n: 3 }, merge: 'auto' } },
    prove:   { label: 'Prove',   verdicts: ['pass', 'fail'], noun: 'failure', makes: { fail: 1 }, cfg: { harness: 'claude', skill: 'my-verify', model: 'opus', effort: 'medium', spawn: 'no', checkpoint: 'steward', copies: { mode: 'one', n: 1 }, merge: 'auto' } },
    review:  { label: 'Review',  verdicts: ['clean', 'findings'], noun: 'finding', makes: { findings: 2 }, cfg: { harness: 'claude', skill: 'code-review', model: 'opus', effort: 'high', spawn: 'no', checkpoint: 'steward', copies: { mode: 'one', n: 1 }, merge: 'auto' } },
    decide:  { label: 'Decide',  verdicts: ['ship', 'another-round'], noun: 'note', makes: {}, cfg: { harness: 'claude', skill: 'html', model: 'opus', effort: 'medium', spawn: 'no', checkpoint: 'wait', copies: { mode: 'one', n: 1 }, merge: 'auto' } },
    merger:  { label: 'Merger',  verdicts: ['merged'], merger: true, noun: 'branch', makes: {}, cfg: { harness: 'claude', skill: 'resolving-merge-conflicts', model: 'opus', effort: 'high', conflict: 'resolver', of: null } },
    gate:    { label: 'Gate',    verdicts: ['open'], gate: true, cfg: { open: 'operator', join: 'any' } },
    finish:  { label: 'Finish',  verdicts: [], terminal: true, cfg: {} },
  };
  const ENUMS = {
    spawn: ['no', 'ask', 'yes'],
    checkpoint: ['wait', 'steward', 'continue', 'rest'],
    merge: ['auto', 'off'],
    conflict: ['resolver', 'wait'],
    open: ['operator', 'steward', 'auto'],
    join: ['any', 'all'],
    'steward-edits': ['yes', 'no'],
  };
  /* Free text: any harness the machine has. These are only quick picks. */
  const SUGGEST = {
    harness: ['claude', 'codex', 'cursor', 'opencode'],
    model: ['opus', 'sonnet', 'haiku', 'gpt-5.5', 'composer-2', 'kimi-k2'],
    effort: ['low', 'medium', 'high', 'xhigh'],
  };
  const PLAN_FIELDS = ['steward-edits', 'author', 'source', 'note'];
  /* What the Steward may send. Edits need "Steward may edit this plan". */
  const EDITS = ['addNode', 'removeNode', 'set', 'link', 'unlink', 'setLoop', 'loopSteward', 'move', 'rename'];
  const STEER = ['resume', 'adopt', 'discard', 'open'];
  const ACTIVE = ['running', 'checkpoint', 'resting'];
  const isAgent = k => !KINDS[k].gate && !KINDS[k].terminal && !KINDS[k].merger;
  function fieldsFor(kind) {
    if (KINDS[kind].gate) return ['title', 'open', 'join'];
    if (KINDS[kind].terminal) return ['title'];
    if (KINDS[kind].merger) return ['title', 'skill', 'harness', 'model', 'effort', 'conflict'];
    return ['title', 'skill', 'harness', 'model', 'effort', 'spawn', 'checkpoint', 'copies', 'merge'];
  }

  /* ---------- state ---------- */
  function freshRun() {
    return { live: false, prompt: '', clock: 0, nodes: {}, edges: {}, held: [], spent: [], finished: false, heldSeq: 0 };
  }
  function emptyPlan(name = 'Untitled factory') {
    return { name, author: '', source: '', note: '', stewardEdits: false, nodes: {}, edges: [] };
  }
  function empty(name = 'Untitled factory', presets = {}) {
    return { plan: emptyPlan(name), run: freshRun(), presets, log: [], notice: null, changed: [] };
  }
  const rn = (s, id) => (s.run.nodes[id] ||= { status: 'idle', pass: 0, copies: [], queue: [], cap: 1, seq: 0, parked: {}, inbox: [], arrived: {}, waiting: null, made: 0, armed: false, waitingFor: [] });
  const es = (s, id) => (s.run.edges[id] ||= { count: 0, extra: 0, stewardUsed: false });
  const edgeId = (from, on, to) => `${from}.${on}>${to}`;
  const capOf = e => (e.max == null ? null : e.max + (e.extra || 0));

  /* ---------- the file a plan saves as ---------- */
  function toFile(s) {
    const p = s.plan;
    return {
      horde: 1,
      name: p.name,
      ...(p.author ? { author: p.author } : {}),
      ...(p.source ? { source: p.source } : {}),
      ...(p.note ? { note: p.note } : {}),
      stewardEdits: !!p.stewardEdits,
      nodes: Object.values(p.nodes).map(n => structuredClone(n)),
      edges: p.edges.map(e => ({ from: e.from, on: e.on, to: e.to, ...(e.max != null ? { max: e.max } : {}), ...(e.steward ? { steward: true } : {}) })),
    };
  }
  function fromFile(f) {
    if (!f || f.horde !== 1 || !Array.isArray(f.nodes) || !Array.isArray(f.edges)) throw new Error('That is not a Horde plan file (it needs "horde": 1, nodes and edges).');
    const nodes = {};
    for (const n of f.nodes) {
      if (!KINDS[n.kind]) throw new Error(`Unknown node type "${n.kind}".`);
      if (n.id === 'plan') throw new Error('"plan" is reserved for plan settings; rename that node.');
      nodes[n.id] = { ...structuredClone(KINDS[n.kind].cfg), ...structuredClone(n) };
      const c = nodes[n.id].copies;
      if (c && !(c.mode === 'one' || (c.mode === 'per-item' && (c.n === 'all' || (Number.isInteger(c.n) && c.n >= 1))))) throw new Error(`${n.id}: copies is one or per-item with a cap (a number or "all").`);
    }
    for (const n of Object.values(nodes)) if (n.kind === 'merger' && n.of != null && !nodes[n.of]) throw new Error(`${n.id} merges ${n.of}, which is not in the file.`);
    const edges = f.edges.map(e => {
      if (!nodes[e.from] || !nodes[e.to]) throw new Error(`Edge ${e.from} → ${e.to} names a node that is not in the file.`);
      return { id: edgeId(e.from, e.on, e.to), from: e.from, on: e.on, to: e.to, max: e.max ?? null, steward: !!e.steward };
    });
    return { name: f.name || 'Untitled factory', author: f.author || '', source: f.source || '', note: f.note || '', stewardEdits: !!f.stewardEdits, nodes, edges };
  }

  /* ---------- reducer ---------- */
  function say(s, text, tone = 'info') { s.log[s.log.length - 1].lines.push({ text, tone }); }
  function refuse(s, text) { s.notice = text; say(s, text, 'refuse'); }

  function reduce(state, a) {
    const s = structuredClone(state);
    s.notice = null;
    s.changed = [];
    if (!a.quiet) s.log.push({ cmd: toCommand(a), lines: [] });
    else s.log.push({ cmd: null, lines: [] });
    const h = H[a.type];
    if (!h) refuse(s, `I don't know how to "${a.type}".`);
    else if (!(a.as === 'steward' && !stewardMay(s, a))) h(s, a);
    settle(s);
    if (a.quiet && !s.log[s.log.length - 1].lines.length) s.log.pop();
    return s;
  }

  /* The Steward steers the run; it edits the plan only when the plan allows it. */
  function stewardMay(s, a) {
    if (EDITS.includes(a.type)) {
      if (s.plan.stewardEdits) return true;
      refuse(s, `The Steward may not edit this plan, so "${toCommand({ ...a, as: null })}" was refused. Turn on "Steward may edit this plan" (set plan steward-edits yes) to let it.`);
      return false;
    }
    if (!STEER.includes(a.type)) {
      refuse(s, `The Steward only steers the run (resume, adopt, discard, or open a gate whose opener is steward). "${toCommand({ ...a, as: null })}" is yours to send.`);
      return false;
    }
    if (a.type === 'open') {
      const node = findNode(s, a.id);
      if (node && KINDS[node.kind].gate && node.open !== 'steward') {
        refuse(s, `Only you open ${a.id}: its opener is ${node.open}.`);
        return false;
      }
    }
    return true;
  }

  const findNode = (s, id) => s.plan.nodes[id];
  function findCopy(s, copyId) {
    const nodeId = String(copyId).split('#')[0];
    const r = s.run.nodes[nodeId];
    const c = r && r.copies.find(c => c.id === copyId);
    return c ? { c, r, node: s.plan.nodes[nodeId] } : null;
  }
  function reachable(s, from, to) {
    const seen = new Set([from]); const q = [from];
    while (q.length) {
      const x = q.shift();
      if (x === to) return true;
      for (const e of s.plan.edges) if (e.from === x && !seen.has(e.to)) { seen.add(e.to); q.push(e.to); }
    }
    return false;
  }
  const live = r => r.copies.filter(c => ACTIVE.includes(c.status)).length;
  const busy = r => live(r) > 0 || r.queue.length > 0;
  const plural = (n, w) => `${n} ${n === 1 ? w : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : /(ch|sh|s|x)$/.test(w) ? w + 'es' : w + 's'}`;
  const counts = r => `${live(r)} running · ${r.queue.length} queued`;
  const capText = n => (n === Infinity ? 'all' : n);
  function newCopy(s, id, r, item, spawned = false) {
    return { id: `${id}#${r.pass}.${++r.seq}`, status: 'running', item, out: null, verdict: null, spawned, wakeAt: null };
  }

  /* ---------- mergers ---------- */
  const mergerOf = (s, id) => Object.values(s.plan.nodes).find(n => n.kind === 'merger' && n.of === id);
  const wantsMerger = n => isAgent(n.kind) && n.copies.mode === 'per-item' && n.merge === 'auto';
  function reid(s, e, from, on) {
    const old = e.id;
    e.from = from; e.on = on; e.id = edgeId(from, on, e.to);
    if (s.run.edges[old]) { s.run.edges[e.id] = s.run.edges[old]; delete s.run.edges[old]; }
    for (const x of s.run.spent) if (x.edge === old) x.edge = e.id;
  }
  function placeMerger(s, id) {
    const node = findNode(s, id), ok = KINDS[node.kind].verdicts[0];
    let mid = `${id}-merge`, k = 1;
    while (s.plan.nodes[mid] || mid === 'plan') mid = `${id}-merge-${++k}`;
    s.plan.nodes[mid] = { id: mid, kind: 'merger', title: `Merge ${node.title}`, x: node.x, y: node.y + 250, ...structuredClone(KINDS.merger.cfg), of: id };
    const outs = s.plan.edges.filter(e => e.from === id && e.on === ok);
    for (const e of outs) {
      if (s.plan.edges.some(x => x.id === edgeId(mid, 'merged', e.to))) { s.plan.edges = s.plan.edges.filter(x => x !== e); continue; }
      reid(s, e, mid, 'merged');
    }
    s.plan.edges.push({ id: edgeId(id, ok, mid), from: id, on: ok, to: mid, max: null, steward: false });
    s.changed.push(mid);
    say(s, `Put down ${mid} beside ${id}: ${id} "${ok}" now goes through it${outs.length ? `, and ${mid} "merged" carries on to ${outs.map(e => e.to).join(', ')}` : ''}.`);
    flowParked(s, id, ok, s.plan.edges.find(e => e.id === edgeId(id, ok, mid)));
  }
  function liftMerger(s, mid, why) {
    const m = findNode(s, mid), src = m.of && findNode(s, m.of);
    const ok = src ? KINDS[src.kind].verdicts[0] : null;
    s.plan.edges = s.plan.edges.filter(e => e.to !== mid);
    for (const e of s.plan.edges.filter(e => e.from === mid)) {
      if (!src || s.plan.edges.some(x => x.id === edgeId(src.id, ok, e.to))) { s.plan.edges = s.plan.edges.filter(x => x !== e); continue; }
      reid(s, e, src.id, ok);
    }
    s.run.spent = s.run.spent.filter(x => s.plan.edges.some(e => e.id === x.edge));
    delete s.plan.nodes[mid];
    delete s.run.nodes[mid];
    if (src) s.changed.push(src.id);
    say(s, `${why} ${src ? `${src.id}'s links go straight from it again, and its branches travel on separately.` : ''}`.trim());
  }

  /* ---------- the run ---------- */
  function startNode(s, id, packet, opts = {}) {
    const node = findNode(s, id), r = rn(s, id), K = KINDS[node.kind];
    s.changed.push(id);
    if (K.terminal) {
      r.pass++; r.status = 'holding'; r.input = packet; r.waitingFor = [];
      say(s, `Reached ${node.title}.`);
      return;
    }
    if (K.merger) return startMerger(s, id, packet);
    if (busy(r)) {
      r.inbox.push(packet);
      say(s, `${id} is still working, so the handoff from ${packet.from} waits in its inbox.`);
      return;
    }
    const lostParked = Object.keys(r.parked);
    if (lostParked.length) say(s, `${id} starts again; its earlier waiting handoff (${lostParked.join(', ')}) is replaced.`, 'warn');
    r.pass++; r.status = 'running'; r.parked = {}; r.made = 0; r.input = packet; r.copies = []; r.queue = []; r.seq = 0;
    const items = packet.items || [];
    if (packet.spawned) opts = { ...opts, spawned: true };
    if (node.copies.mode === 'per-item' && items.length && !opts.single) {
      r.cap = node.copies.n === 'all' ? Infinity : node.copies.n;
      const now = items.slice(0, r.cap);
      r.queue = items.slice(r.cap);
      for (const it of now) r.copies.push(newCopy(s, id, r, it, !!opts.spawned));
      say(s, `${id} pass ${r.pass} starts ${plural(now.length, 'copy')}, one per item${r.queue.length ? `; the cap is ${r.cap} at once, so ${plural(r.queue.length, 'item')} queue (${counts(r)})` : ''}.`);
    } else {
      r.cap = node.copies.mode === 'per-item' ? (node.copies.n === 'all' ? Infinity : node.copies.n) : 1;
      r.copies.push(newCopy(s, id, r, items.length ? items.join(', ') : null, !!opts.spawned));
      say(s, `${id} pass ${r.pass} starts 1 copy${node.copies.mode === 'per-item' && !items.length ? ' (nothing was handed in to split, so it works on the prompt)' : ''}.`);
    }
  }

  /* A copy left: the next queued item takes its place, in the same pass. */
  function pullQueue(s, id) {
    const r = rn(s, id), started = [];
    while (r.queue.length && live(r) < r.cap) {
      const c = newCopy(s, id, r, r.queue.shift());
      r.copies.push(c); started.push(c);
    }
    if (started.length) say(s, `${started.map(c => c.id).join(', ')} picks up the next queued item (${started.map(c => c.item).join(', ')}): ${counts(r)}.`);
  }

  function nodeMaybeDone(s, id) {
    const node = findNode(s, id), r = rn(s, id), K = KINDS[node.kind];
    if (busy(r)) return;
    s.changed.push(id);
    if (r.copies.some(c => c.status === 'closed')) {
      r.status = 'halted';
      say(s, `${id} halted because a copy was closed. Nothing flows on from it until it runs again.`, 'warn');
      return;
    }
    if (K.merger) {
      mergeDone(s, id, `${id}: the conflict is resolved and ${plural(r.input.branches.length, 'branch')} merged into the line base.`, intoBase(r.input));
      if (r.inbox.length && !busy(r)) startNode(s, id, r.inbox.shift());
      return;
    }
    const ok = K.verdicts[0];
    const verdict = r.copies.map(c => c.verdict).find(v => v !== ok) ?? ok;
    const items = r.copies.flatMap(c => c.out || []);
    const branches = r.copies.map(c => c.id);
    r.status = 'done'; r.verdict = verdict;
    say(s, `${id} finished: ${verdict}${items.length ? `, handing on ${plural(items.length, 'item')}` : ''}.`);
    if (branches.length > 1 && !(verdict === ok && mergerOf(s, id))) say(s, `${id} has no merger on "${verdict}", so its ${branches.length} branches travel on separately.`, 'warn');
    emit(s, id, verdict, { from: id, verdict, items, branches });
    if (r.inbox.length && !busy(r)) startNode(s, id, r.inbox.shift());
  }

  function startMerger(s, id, packet) {
    const node = findNode(s, id), r = rn(s, id);
    if (busy(r)) {
      r.inbox.push(packet);
      say(s, `${id} is still resolving, so the branches from ${packet.from} wait in its inbox.`);
      return;
    }
    const br = packet.branches || [];
    r.pass++; r.input = packet; r.copies = []; r.queue = []; r.seq = 0; r.parked = {}; r.cap = 1;
    if (br.length <= 1) return mergeDone(s, id, `${id} received a single branch from ${packet.from}, so it passes it through.`, packet, 'info');
    if (r.armed) {
      r.armed = false; r.status = 'running';
      const c = newCopy(s, id, r, `conflict in ${br.join(' + ')}`);
      c.resolver = true;
      r.copies.push(c);
      if (node.conflict === 'wait') {
        c.status = 'checkpoint';
        say(s, `${id}: merging ${plural(br.length, 'branch')} from ${packet.from} hit a conflict. Its conflict setting is wait, so ${c.id} stops at a checkpoint for you. Resume it to let it resolve, or close it.`, 'warn');
      } else {
        say(s, `${id}: merging ${plural(br.length, 'branch')} from ${packet.from} hit a conflict. Resolver ${c.id} runs ${node.skill || 'no skill'} on ${node.harness} · ${node.model} · ${node.effort}. Finish it with "merged" to carry on.`, 'warn');
      }
      return;
    }
    mergeDone(s, id, `${id} merged ${plural(br.length, 'branch')} from ${packet.from} into the line base.`, intoBase(packet));
  }

  /* Every way a merger's pass ends: done, verdict merged, the packet handed on. */
  function mergeDone(s, id, line, packet, tone = 'good') {
    const r = rn(s, id);
    r.status = 'done'; r.verdict = 'merged';
    say(s, line, tone);
    emit(s, id, 'merged', { ...packet, from: id, verdict: 'merged' });
  }
  const intoBase = p => ({ items: p.items || [], branches: ['line base'] });

  /* A handoff waiting on a node flows on along a link made since. */
  function flowParked(s, id, verdict, edge, line) {
    const r = s.run.nodes[id], parked = r && r.parked[verdict];
    if (!parked) return;
    delete r.parked[verdict];
    if (r.status === 'parked' && !Object.keys(r.parked).length) r.status = 'done';
    if (line) say(s, line, 'park');
    traverse(s, edge, parked);
  }

  function emit(s, id, verdict, packet) {
    const outs = s.plan.edges.filter(e => e.from === id && e.on === verdict);
    if (!outs.length) {
      const r = rn(s, id);
      r.parked[verdict] = packet;
      if (r.status === 'done') r.status = 'parked';
      say(s, `Nothing follows ${id} on "${verdict}" yet, so its handoff waits here. Link a next step and it flows on.`, 'park');
      return;
    }
    for (const e of outs) traverse(s, e, packet);
  }

  function traverse(s, e, packet) {
    const st = es(s, e.id);
    if (e.max != null && st.count >= capOf({ max: e.max, extra: st.extra })) {
      if (e.steward && !st.stewardUsed) {
        st.stewardUsed = true; st.extra++;
        say(s, `The loop ${e.from} → ${e.to} has used all its passes. It is marked for the Steward, so the Steward allowed one extra pass by itself (now ${st.count + 1} of ${e.max + st.extra}). Next time it asks you.`, 'steward');
      } else {
        s.run.spent.push({ edge: e.id, packet });
        say(s, `The loop ${e.from} → ${e.to} has used all ${e.max + st.extra} of its passes. The run waits for you: allow one more pass, or stop the loop.`, 'warn');
        return;
      }
    }
    st.count++;
    s.changed.push(e.id);
    deliver(s, e.to, packet, e.id);
  }

  function deliver(s, to, packet, via) {
    const node = findNode(s, to);
    if (!KINDS[node.kind].gate) return startNode(s, to, packet);
    const r = rn(s, to);
    s.changed.push(to);
    r.arrived[via] = packet;
    const incoming = s.plan.edges.filter(e => e.to === to);
    const got = incoming.filter(e => r.arrived[e.id]).length;
    if (node.join === 'all' && got < incoming.length) {
      r.status = 'collecting';
      say(s, `${to} has ${got} of ${incoming.length} inputs and waits for the rest.`);
      return;
    }
    const packets = Object.values(r.arrived);
    r.arrived = {};
    const combined = { from: packets.map(p => p.from).join(' + '), verdict: 'open', items: packets.flatMap(p => p.items), branches: packets.flatMap(p => p.branches || []) };
    if (node.open === 'operator') {
      r.status = 'waiting'; r.waiting = combined;
      say(s, `${to} is closed until you open it.`, 'warn');
      return;
    }
    if (node.open === 'steward') say(s, `The Steward opened ${to} on your behalf.`, 'steward');
    r.pass++; r.status = 'done';
    emit(s, to, 'open', combined);
  }

  function addCopy(s, nodeId, item, why) {
    const r = rn(s, nodeId), node = findNode(s, nodeId);
    s.changed.push(nodeId);
    if (busy(r)) {
      if (node.copies.mode === 'per-item' && live(r) >= r.cap) {
        r.queue.push(item);
        say(s, `${why} It queues behind the cap of ${capText(r.cap)} (${counts(r)}).`, 'good');
        return;
      }
      if (node.copies.mode === 'one') {
        r.inbox.push({ from: 'spawn', items: [item], spawned: true });
        say(s, `${why} ${nodeId} runs one copy at a time, so it waits in ${nodeId}'s inbox and runs as one more pass after this one.`, 'good');
        return;
      }
      const c = newCopy(s, nodeId, r, item, true);
      r.copies.push(c);
      say(s, `${why} ${c.id} joins the running pass.`, 'good');
    } else {
      say(s, `${why} ${nodeId} had already finished, so it runs one more pass for it.`, 'good');
      startNode(s, nodeId, { from: 'spawn', items: [item] }, { single: true, spawned: true });
    }
  }

  /* What a Finish waits on before the run may end. A gate still
     collecting, or a handoff waiting on a node, does not hold it. */
  function blockers(s) {
    const out = [];
    for (const [id, r] of Object.entries(s.run.nodes)) {
      for (const c of r.copies) if (ACTIVE.includes(c.status)) out.push(`${c.id} ${c.status === 'running' ? 'running' : c.status === 'checkpoint' ? 'at a checkpoint' : 'resting'}`);
      if (r.queue.length) out.push(`${plural(r.queue.length, 'queued item')} at ${id}`);
      if (r.inbox.length) out.push(`${plural(r.inbox.length, 'handoff')} in ${id}'s inbox`);
      if (r.status === 'waiting') out.push(`gate ${id} to be opened`);
    }
    for (const h of s.run.held) out.push(`held spawn ${h.id}`);
    for (const x of s.run.spent) out.push(`spent loop ${x.edge}`);
    return out;
  }
  function settle(s) {
    for (const n of Object.values(s.plan.nodes)) {
      const r = s.run.nodes[n.id];
      if (!KINDS[n.kind].terminal || !r || r.status !== 'holding') continue;
      const b = blockers(s), prev = r.waitingFor;
      if (!b.length) {
        r.status = 'done'; r.waitingFor = []; s.run.finished = true; s.changed.push(n.id);
        say(s, prev.length ? `Nothing else is running or queued, so ${n.title} completes. The run is finished.` : `Nothing else is running, so the run is finished.`, 'good');
      } else if (b.join('|') !== prev.join('|')) {
        r.waitingFor = b; s.changed.push(n.id);
        say(s, `${n.title} is waiting for: ${b.join(', ')}.`, 'warn');
      }
    }
  }

  function parseCopies(v) {
    if (typeof v === 'object' && v) return v;
    const m = String(v).match(/^(one|per-item)(?::(\d+|all))?$/);
    if (!m) return null;
    if (m[1] === 'one') return { mode: 'one', n: 1 };
    return { mode: 'per-item', n: m[2] === 'all' ? 'all' : Math.max(1, +(m[2] || 3)) };
  }

  const H = {
    newEmpty(s, a) {
      const p = s.presets;
      Object.assign(s, empty(a.name || 'Untitled factory', p));
      s.log = [{ cmd: 'new', lines: [] }];
      say(s, 'Started an empty factory. Put a node down from the shelf, or load a preset.');
    },
    rename(s, a) { s.plan.name = a.name; say(s, `Renamed to "${a.name}".`); },
    preset(s, a) {
      const f = s.presets[a.name];
      if (!f) return refuse(s, `There is no preset called "${a.name}".`);
      s.plan = fromFile(f); s.run = freshRun();
      say(s, `Loaded the preset "${f.name}"${f.author ? ` by ${f.author}` : ''}.`);
    },
    load(s, a) {
      try { s.plan = fromFile(a.file); s.run = freshRun(); say(s, `Loaded "${s.plan.name}" from a plan file.`); }
      catch (err) { refuse(s, err.message); }
    },
    savePreset(s, a) {
      const name = a.name || s.plan.name;
      const keep = s.presets[name] && s.presets[name].author;
      s.presets[name] = { ...toFile(s), name, author: keep || 'Yours' };
      say(s, `Saved this layout as the preset "${name}".`, 'good');
    },
    resetRun(s) { s.run = freshRun(); say(s, 'Cleared the run. The layout is untouched.'); },

    addNode(s, a) {
      const K = KINDS[a.kind];
      if (!K) return refuse(s, `There is no node type called "${a.kind}". Try ${Object.keys(KINDS).join(', ')}.`);
      let id = a.id;
      if (id === 'plan') return refuse(s, '"plan" is reserved for plan settings (set plan …). Pick another id.');
      if (id && s.plan.nodes[id]) return refuse(s, `${id} already exists.`);
      if (!id) { id = a.kind; let n = 1; while (s.plan.nodes[id]) id = `${a.kind}-${++n}`; }
      const count = Object.keys(s.plan.nodes).length;
      s.plan.nodes[id] = { id, kind: a.kind, title: a.title || K.label, x: a.x ?? 40 + (count % 7) * 300, y: a.y ?? 60 + Math.floor(count / 7) * 240, ...structuredClone(K.cfg) };
      s.changed.push(id);
      say(s, `Put down ${a.title || K.label} as ${id}.`);
      if (wantsMerger(s.plan.nodes[id])) placeMerger(s, id);
    },
    removeNode(s, a) {
      const node = findNode(s, a.id);
      if (!node) return refuse(s, `There is no node ${a.id}.`);
      const m = node.kind === 'merger' ? null : mergerOf(s, a.id);
      for (const x of [node, m].filter(Boolean)) {
        const r = s.run.nodes[x.id];
        if (r && (busy(r) || ['waiting', 'collecting'].includes(r.status))) return refuse(s, `${x.id} is in the middle of a pass. Close its copies or let it finish before you remove it.`);
      }
      if (node.kind === 'merger') {
        const src = node.of && findNode(s, node.of);
        if (src) src.merge = 'off';
        return liftMerger(s, a.id, `Removed ${a.id}, so merge is off for ${node.of || 'nothing'}.`);
      }
      const ids = [a.id, ...(m ? [m.id] : [])];
      for (const id of ids) { delete s.plan.nodes[id]; delete s.run.nodes[id]; }
      const gone = s.plan.edges.filter(e => ids.includes(e.from) || ids.includes(e.to)).map(e => e.id);
      s.plan.edges = s.plan.edges.filter(e => !gone.includes(e.id));
      s.run.spent = s.run.spent.filter(x => !gone.includes(x.edge));
      s.run.held = s.run.held.filter(h => h.node !== a.id);
      say(s, `Removed ${a.id}${m ? ` and its merger ${m.id}` : ''}${gone.length ? ` and ${plural(gone.length, 'link')}` : ''}.`);
    },
    move(s, a) {
      const n = findNode(s, a.id);
      if (!n) return refuse(s, `There is no node ${a.id}.`);
      n.x = a.x; n.y = a.y;
    },
    set(s, a) {
      if (a.id === 'plan') return setPlan(s, a);
      const node = findNode(s, a.id);
      if (!node) return refuse(s, `There is no node ${a.id}.`);
      if (!fieldsFor(node.kind).includes(a.field)) return refuse(s, `A ${KINDS[node.kind].label} has no "${a.field}" setting. It has: ${fieldsFor(node.kind).join(', ')}.`);
      let v = a.value;
      if (ENUMS[a.field] && !ENUMS[a.field].includes(v)) return refuse(s, `"${v}" is not a choice for ${a.field}. Pick one of ${ENUMS[a.field].join(', ')}.`);
      if (a.field === 'copies') { v = parseCopies(v); if (!v) return refuse(s, 'Copies is one, or per-item:N (at most N at once) or per-item:all.'); }
      if (['harness', 'model', 'effort'].includes(a.field) && !String(v).trim()) return refuse(s, `${a.field} cannot be empty.`);
      const m = mergerOf(s, a.id), mr = m && s.run.nodes[m.id];
      if (m && mr && busy(mr) && ((a.field === 'merge' && v === 'off') || (a.field === 'copies' && v.mode === 'one'))) return refuse(s, `${m.id} is resolving a merge. Let it finish before you take it away.`);
      node[a.field] = v;
      s.changed.push(a.id);
      const r = s.run.nodes[a.id];
      const later = r && busy(r) && a.field === 'copies' ? ' The running pass keeps its cap; this applies from the next pass.' : '';
      say(s, `${a.id}: ${a.field} is now ${a.field === 'copies' ? fmtCopies(v) : v}.${later}`);
      if (a.field === 'copies' || a.field === 'merge') {
        if (wantsMerger(node) && !m) placeMerger(s, a.id);
        else if (!wantsMerger(node) && m) liftMerger(s, m.id, a.field === 'merge' ? `Took ${m.id} away.` : `${a.id} runs one copy now, so ${m.id} is taken away.`);
        else if (a.field === 'merge' && v === 'auto' && node.copies.mode === 'one') say(s, `${a.id} runs one copy, so there is nothing to merge. A merger goes down when its copies are per-item.`);
      }
    },
    link(s, a) {
      let from = findNode(s, a.from);
      const to = findNode(s, a.to);
      if (!from || !to) return refuse(s, `Both ends must be nodes on the canvas (${a.from} → ${a.to}).`);
      if (!KINDS[from.kind].verdicts.includes(a.on)) return refuse(s, `${a.from} never says "${a.on}". It says ${KINDS[from.kind].verdicts.join(' or ') || 'nothing; it ends the run'}.`);
      let on = a.on;
      const m = mergerOf(s, a.from);
      if (m && on === KINDS[from.kind].verdicts[0] && a.to !== m.id) {
        say(s, `${a.from} has a merger, so this links from ${m.id} "merged" instead. Remove ${m.id} or set ${a.from} merge off to link straight from ${a.from}.`);
        from = m; on = 'merged';
      }
      if (from.id === a.to) return refuse(s, `A node cannot feed itself. Loop back through another node instead.`);
      const id = edgeId(from.id, on, a.to);
      if (s.plan.edges.some(e => e.id === id)) return refuse(s, `That link already exists.`);
      const back = reachable(s, a.to, from.id);
      let max = a.max ?? null;
      if (back && max == null) max = 2;
      s.plan.edges.push({ id, from: from.id, on, to: a.to, max, steward: false });
      s.changed.push(id);
      say(s, back ? `Linked ${from.id} "${on}" back to ${a.to}. It loops, so it is capped at ${max} passes.` : `Linked ${from.id} "${on}" → ${a.to}.`);
      flowParked(s, from.id, on, s.plan.edges.find(e => e.id === id), `${from.id}'s waiting handoff flows on to ${a.to}.`);
    },
    unlink(s, a) {
      if (!s.plan.edges.some(e => e.id === a.edge)) return refuse(s, `There is no link ${a.edge}.`);
      s.plan.edges = s.plan.edges.filter(e => e.id !== a.edge);
      s.run.spent = s.run.spent.filter(x => x.edge !== a.edge);
      say(s, `Removed the link ${a.edge}.`);
    },
    setLoop(s, a) {
      const e = s.plan.edges.find(e => e.id === a.edge);
      if (!e) return refuse(s, `There is no link ${a.edge}.`);
      if (a.max == null && reachable(s, e.to, e.from)) return refuse(s, `${a.edge} loops back, and a loop always needs a cap.`);
      if (a.max != null && (!Number.isInteger(a.max) || a.max < 1)) return refuse(s, 'A cap is a whole number of passes, 1 or more.');
      e.max = a.max;
      if (a.max == null) e.steward = false;
      s.changed.push(e.id);
      say(s, a.max == null ? `${a.edge} has no cap.` : `${a.edge} is capped at ${a.max} passes (used ${es(s, e.id).count}).`);
    },
    loopSteward(s, a) {
      const e = s.plan.edges.find(e => e.id === a.edge);
      if (!e) return refuse(s, `There is no link ${a.edge}.`);
      if (!['yes', 'no'].includes(a.value)) return refuse(s, 'The Steward mark is yes or no.');
      if (e.max == null) return refuse(s, `${a.edge} has no cap, so there is no extra pass to allow.`);
      e.steward = a.value === 'yes';
      s.changed.push(e.id);
      say(s, e.steward ? `When ${a.edge} is spent, the Steward may allow one extra pass by itself, once. After that it asks you.` : `When ${a.edge} is spent, it asks you.`);
    },

    run(s, a) {
      const node = findNode(s, a.id);
      if (!node) return refuse(s, `There is no node ${a.id}.`);
      if (KINDS[node.kind].merger) return refuse(s, `${a.id} is a merger: it runs when the node before it hands over its branches.`);
      if (!isAgent(node.kind)) return refuse(s, `${a.id} is a ${KINDS[node.kind].label}; run an agent node instead.`);
      const r = s.run.nodes[a.id];
      if (r && busy(r)) return refuse(s, `${a.id} is already running.`);
      if (a.prompt != null) s.run.prompt = a.prompt;
      s.run.live = true;
      startNode(s, a.id, { from: 'you', verdict: 'prompt', items: [], note: s.run.prompt });
    },
    runAll(s, a) {
      /* A loop link coming back does not make a node a later step: Foggy starts at the chart its research loops back to. */
      const loopsBack = e => e.max != null && reachable(s, e.to, e.from);
      const entries = Object.values(s.plan.nodes).filter(n => isAgent(n.kind) && !s.plan.edges.some(e => e.to === n.id && !loopsBack(e)));
      if (!entries.length) return refuse(s, 'There is no node to start: put an agent node down first.');
      if (a.prompt != null) s.run.prompt = a.prompt;
      if (!s.run.prompt) return refuse(s, 'Write an opening prompt first.');
      s.run.live = true;
      for (const n of entries) if (!busy(rn(s, n.id))) startNode(s, n.id, { from: 'you', verdict: 'prompt', items: [], note: s.run.prompt });
    },
    finish(s, a) {
      const f = findCopy(s, a.copy);
      if (!f) return refuse(s, `There is no copy ${a.copy}.`);
      const { c, r, node } = f, K = KINDS[node.kind];
      if (c.status !== 'running') return refuse(s, `${a.copy} is ${c.status}; only a running copy can finish.`);
      if (!K.verdicts.includes(a.verdict)) return refuse(s, `${node.id} says ${K.verdicts.join(' or ')}, not "${a.verdict}".`);
      const n = K.merger ? 0 : a.items ?? (K.makes[a.verdict] || 0);
      c.status = 'done'; c.verdict = a.verdict;
      if (n > 0) {
        c.out = [];
        for (let i = 0; i < n; i++) { r.made++; c.out.push(`${K.noun} ${r.made}${r.pass > 1 ? ` (pass ${r.pass})` : ''}`); }
      } else c.out = c.item && !c.resolver ? [c.item] : [];
      say(s, `${a.copy} said "${a.verdict}"${n > 0 ? ` with ${plural(n, K.noun)}` : ''}.`);
      pullQueue(s, node.id);
      nodeMaybeDone(s, node.id);
    },
    checkpoint(s, a) {
      const f = findCopy(s, a.copy);
      if (!f) return refuse(s, `There is no copy ${a.copy}.`);
      const { c, node } = f;
      if (c.status !== 'running') return refuse(s, `${a.copy} is ${c.status}; only a running copy can stop at a checkpoint.`);
      s.changed.push(node.id);
      switch (node.checkpoint || 'wait') {
        case 'wait': c.status = 'checkpoint'; say(s, `${a.copy} stopped at a checkpoint and waits for you.`, 'warn'); break;
        case 'steward': say(s, `${a.copy} stopped at a checkpoint. The Steward answered it and the copy carried on.`, 'steward'); break;
        case 'continue': say(s, `${a.copy} stopped at a checkpoint. The engine typed "continue" and it carried on.`); break;
        case 'rest': c.status = 'resting'; c.wakeAt = s.run.clock + 1; say(s, `${a.copy} rests until the clock ticks (say, a usage limit resets). The rest of the run carries on.`); break;
      }
    },
    resume(s, a) {
      const f = findCopy(s, a.copy);
      if (!f) return refuse(s, `There is no copy ${a.copy}.`);
      if (!['checkpoint', 'resting'].includes(f.c.status)) return refuse(s, `${a.copy} is ${f.c.status}; there is nothing to resume.`);
      f.c.status = 'running'; f.c.wakeAt = null; s.changed.push(f.node.id);
      say(s, `${a.copy} resumed${a.as === 'steward' ? ' by the Steward' : ''}.`, a.as === 'steward' ? 'steward' : 'info');
    },
    close(s, a) {
      const f = findCopy(s, a.copy);
      if (!f) return refuse(s, `There is no copy ${a.copy}.`);
      if (!ACTIVE.includes(f.c.status)) return refuse(s, `${a.copy} is already ${f.c.status}.`);
      f.c.status = 'closed';
      say(s, `Closed ${a.copy}.`, 'warn');
      pullQueue(s, f.node.id);
      nodeMaybeDone(s, f.node.id);
    },
    tick(s) {
      s.run.clock++;
      let woke = 0;
      for (const r of Object.values(s.run.nodes)) for (const c of r.copies) if (c.status === 'resting' && c.wakeAt <= s.run.clock) { c.status = 'running'; c.wakeAt = null; woke++; s.changed.push(c.id.split('#')[0]); }
      say(s, `The clock is at ${s.run.clock}.${woke ? ` ${plural(woke, 'resting copy')} woke and carried on.` : ''}`);
    },
    spawn(s, a) {
      const f = findCopy(s, a.copy);
      if (!f) return refuse(s, `There is no copy ${a.copy}.`);
      if (f.c.status !== 'running') return refuse(s, `${a.copy} is ${f.c.status}; only a running copy proposes follow-up work.`);
      const node = f.node, mode = node.spawn || 'no';
      if (mode === 'no') return say(s, `${node.id} may not spawn, so ${a.copy}'s proposal "${a.what}" was dropped.`, 'refuse');
      if (mode === 'ask') {
        const id = `h${++s.run.heldSeq}`;
        s.run.held.push({ id, node: node.id, from: a.copy, what: a.what });
        return say(s, `${a.copy} proposed "${a.what}". It is held as ${id} until you adopt or discard it.`, 'steward');
      }
      addCopy(s, node.id, a.what, `${a.copy} spawned "${a.what}".`);
    },
    adopt(s, a) {
      const h = s.run.held.find(h => h.id === a.held);
      if (!h) return refuse(s, `There is no held spawn ${a.held}.`);
      s.run.held = s.run.held.filter(x => x !== h);
      addCopy(s, h.node, h.what, `${a.as === 'steward' ? 'The Steward' : 'You'} adopted ${h.id}.`);
    },
    discard(s, a) {
      const h = s.run.held.find(h => h.id === a.held);
      if (!h) return refuse(s, `There is no held spawn ${a.held}.`);
      s.run.held = s.run.held.filter(x => x !== h);
      say(s, `${a.as === 'steward' ? 'The Steward' : 'You'} discarded ${h.id} ("${h.what}").`);
    },
    open(s, a) {
      const node = findNode(s, a.id), r = s.run.nodes[a.id];
      if (!node || !KINDS[node.kind].gate) return refuse(s, `${a.id} is not a gate.`);
      if (!r || r.status !== 'waiting') return refuse(s, `${a.id} has nothing waiting at it${r && r.status === 'collecting' ? ' yet; it still waits for inputs' : ''}.`);
      const p = r.waiting; r.waiting = null; r.pass++; r.status = 'done'; s.changed.push(a.id);
      say(s, `${a.as === 'steward' ? 'The Steward' : 'You'} opened ${a.id}.`, a.as === 'steward' ? 'steward' : 'good');
      emit(s, a.id, 'open', p);
    },
    allow(s, a) {
      const x = s.run.spent.find(x => x.edge === a.edge);
      if (!x) return refuse(s, `${a.edge} is not waiting on a spent loop.`);
      s.run.spent = s.run.spent.filter(y => y !== x);
      const e = s.plan.edges.find(e => e.id === a.edge), st = es(s, e.id);
      st.extra++;
      say(s, `You allowed one more pass round ${a.edge} (${e.max + st.extra} this run).`);
      traverse(s, e, x.packet);
    },
    stop(s, a) {
      const x = s.run.spent.find(x => x.edge === a.edge);
      if (!x) return refuse(s, `${a.edge} is not waiting on a spent loop.`);
      s.run.spent = s.run.spent.filter(y => y !== x);
      const e = s.plan.edges.find(e => e.id === a.edge);
      const r = rn(s, e.from);
      r.parked[e.on] = x.packet; r.status = 'parked';
      say(s, `You stopped the loop. ${e.from}'s "${e.on}" handoff waits there; link it somewhere else to carry on.`, 'park');
    },
    conflict(s, a) {
      const node = findNode(s, a.id);
      if (!node || node.kind !== 'merger') return refuse(s, `${a.id} is not a merger.`);
      const r = rn(s, a.id);
      if (r.armed) return refuse(s, `${a.id}'s next merge already conflicts.`);
      r.armed = true; s.changed.push(a.id);
      say(s, `${a.id}'s next merge of more than one branch will conflict (free play: there is no real git here).`, 'warn');
    },
  };

  function setPlan(s, a) {
    if (!PLAN_FIELDS.includes(a.field)) return refuse(s, `The plan has no "${a.field}" setting. It has: ${PLAN_FIELDS.join(', ')}.`);
    const v = a.value;
    if (a.field === 'steward-edits') {
      if (!ENUMS['steward-edits'].includes(v)) return refuse(s, 'Steward edits is yes or no.');
      s.plan.stewardEdits = v === 'yes';
      return say(s, v === 'yes' ? 'The Steward may edit this plan.' : 'The Steward may not edit this plan; it only steers the run.');
    }
    s.plan[a.field] = v;
    say(s, `The plan's ${a.field} is now ${v ? `"${v}"` : 'empty'}.`);
  }

  /* ---------- the command language an agent speaks ---------- */
  const q = v => (v == null ? '' : /[\s"]/.test(String(v)) || v === '' ? `"${String(v).replace(/"/g, "'")}"` : String(v));
  const fmtCopies = c => (c.mode === 'one' ? 'one' : `per-item:${c.n}`);
  function toCommand(a) {
    return (a.as === 'steward' ? 'as steward: ' : '') + command(a);
  }
  function command(a) {
    switch (a.type) {
      case 'newEmpty': return 'new' + (a.name ? ` ${q(a.name)}` : '');
      case 'rename': return `name ${q(a.name)}`;
      case 'preset': return `preset ${q(a.name)}`;
      case 'load': return 'load <plan file>';
      case 'savePreset': return `save ${q(a.name || '')}`.trim();
      case 'resetRun': return 'reset run';
      case 'addNode': return `add ${a.kind}${a.id ? ` as ${a.id}` : ''}${a.x != null ? ` at ${a.x} ${a.y}` : ''}${a.title ? ` ${q(a.title)}` : ''}`;
      case 'removeNode': return `remove ${a.id}`;
      case 'move': return `move ${a.id} ${a.x} ${a.y}`;
      case 'set': return `set ${a.id} ${a.field} ${a.field === 'copies' && typeof a.value === 'object' ? fmtCopies(a.value) : q(a.value)}`;
      case 'link': return `link ${a.from}.${a.on} -> ${a.to}${a.max != null ? ` max ${a.max}` : ''}`;
      case 'unlink': return `unlink ${a.edge}`;
      case 'setLoop': return `loop ${a.edge} max ${a.max ?? 'none'}`;
      case 'loopSteward': return `loop ${a.edge} steward ${a.value}`;
      case 'run': return `run ${a.id}${a.prompt != null ? ` ${q(a.prompt)}` : ''}`;
      case 'runAll': return `run all${a.prompt != null ? ` ${q(a.prompt)}` : ''}`;
      case 'finish': return `finish ${a.copy} ${a.verdict}${a.items != null ? ` items ${a.items}` : ''}`;
      case 'spawn': return `spawn ${a.copy} ${q(a.what)}`;
      case 'checkpoint': case 'resume': case 'close': return `${a.type} ${a.copy}`;
      case 'adopt': case 'discard': return `${a.type} ${a.held}`;
      case 'open': case 'conflict': return `${a.type} ${a.id}`;
      case 'allow': case 'stop': return `${a.type} ${a.edge}`;
      case 'tick': return 'tick';
      default: return a.type;
    }
  }
  function parse(line) {
    const st = String(line).match(/^\s*as\s+steward:\s*(.*)$/i);
    if (st) return { ...parse(st[1]), as: 'steward' };
    const t = []; const re = /"([^"]*)"|(\S+)/g; let m;
    while ((m = re.exec(line))) t.push(m[1] ?? m[2]);
    const [v, ...r] = t;
    switch (v) {
      case 'new': return { type: 'newEmpty', name: r[0] };
      case 'name': return { type: 'rename', name: r[0] };
      case 'preset': return { type: 'preset', name: r.join(' ') };
      case 'save': return { type: 'savePreset', name: r.join(' ') || undefined };
      case 'reset': return { type: 'resetRun' };
      case 'add': {
        const a = { type: 'addNode', kind: r[0] };
        for (let i = 1; i < r.length; i++) {
          if (r[i] === 'as') a.id = r[++i];
          else if (r[i] === 'at') { a.x = +r[++i]; a.y = +r[++i]; }
          else a.title = r[i];
        }
        return a;
      }
      case 'remove': return { type: 'removeNode', id: r[0] };
      case 'move': return { type: 'move', id: r[0], x: +r[1], y: +r[2] };
      case 'set': return { type: 'set', id: r[0], field: r[1], value: r.slice(2).join(' ') };
      case 'link': {
        const [from, on] = (r[0] || '').split('.');
        const a = { type: 'link', from, on, to: r[1] === '->' ? r[2] : r[1] };
        const mi = r.indexOf('max'); if (mi > 0) a.max = +r[mi + 1];
        return a;
      }
      case 'unlink': return { type: 'unlink', edge: r[0] };
      case 'loop': return r[1] === 'steward' ? { type: 'loopSteward', edge: r[0], value: r[2] } : { type: 'setLoop', edge: r[0], max: r[2] === 'none' ? null : +r[2] };
      case 'run': return r[0] === 'all' ? { type: 'runAll', prompt: r[1] } : { type: 'run', id: r[0], prompt: r[1] };
      case 'finish': return { type: 'finish', copy: r[0], verdict: r[1], items: r[2] === 'items' ? +r[3] : undefined };
      case 'spawn': return { type: 'spawn', copy: r[0], what: r.slice(1).join(' ') };
      case 'checkpoint': case 'resume': case 'close': return { type: v, copy: r[0] };
      case 'adopt': case 'discard': return { type: v, held: r[0] };
      case 'open': case 'conflict': return { type: v, id: r[0] };
      case 'allow': case 'stop': return { type: v, edge: r[0] };
      case 'tick': return { type: 'tick' };
      default: return { type: v || '(empty)' };
    }
  }

  function run(state, lines) {
    return lines.reduce((s, l) => reduce(s, parse(l)), state);
  }

  return { KINDS, ENUMS, SUGGEST, PLAN_FIELDS, fieldsFor, isAgent, empty, freshRun, reduce, parse, toCommand, toFile, fromFile, run, fmtCopies, blockers, mergerOf, ACTIVE };
})();

    const s = Horde.run(Horde.empty(name), lines);
    out[name] = { ...Horde.toFile(s), name };
  }
  return out;
}
