<title>Horde Plan Mode</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the Console's own canvas. Header bar, a node shelf, the canvas,
   an inspector on the right, and a tabbed drawer underneath.
   PROTOTYPE: throwaway. The Horde module in the first script block is the part
   worth keeping. */
:root {
  --bg: #0b0e14;
  --bg-panel: #12161f;
  --bg-panel-2: #1a2030;
  --border: #232a3b;
  --text: #d4dae4;
  --text-dim: #7d8597;
  --accent: #4cc2ff;
  --accent-purple: #a371f7;
  --steward: #db61a2;
  --pending: #8b949e;
  --running: #d29922;
  --done: #3fb950;
  --interrupt: #f85149;
  --mono: ui-monospace, "Liberation Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--mono);
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--bg-panel-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 9px;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); color: #06121c; border-color: var(--accent); font-weight: 700; }
button.warn { border-color: var(--interrupt); color: var(--interrupt); }
input, select, textarea {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 6px;
  min-width: 0;
}
.dim { color: var(--text-dim); }
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto auto 1fr minmax(220px, 34%);
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}

/* Header */
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding: 8px max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
}
.brand { font-weight: 700; letter-spacing: .04em; }
.brand span { color: var(--accent-purple); font-weight: 400; margin-left: 6px; text-transform: uppercase; font-size: 11px; letter-spacing: .12em; }
#plan-name { width: 14em; }
#prompt { flex: 1 1 18em; resize: none; height: 28px; line-height: 1.45; transition: height .12s; }
#prompt:focus, #prompt.tall { height: 7.5em; resize: vertical; position: relative; z-index: 20; }
@media (prefers-reduced-motion: reduce) { #prompt { transition: none; } }
.quick { display: flex; flex-wrap: wrap; gap: 3px; }
.quick button { font-size: 11px; padding: 0 6px; border-radius: 10px; }
.quick button.on { border-color: var(--accent); color: var(--accent); }
.links { display: grid; gap: 4px; }
.linkrow { display: flex; gap: 6px; align-items: center; justify-content: space-between; border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px 2px 8px; font-size: 12px; }
.linkrow button { font-size: 11px; padding: 0 6px; }
.addlink { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.addlink select { max-width: 9.5em; }
.port.open { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
.saved { color: var(--done); }
.clock { color: var(--text-dim); font-variant-numeric: tabular-nums; }

/* Needs-you tray */
.tray {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  padding: 6px 16px; min-height: 36px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.tray .label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); }
.ask {
  display: inline-flex; gap: 6px; align-items: center;
  border: 1px solid var(--interrupt); border-radius: 4px; padding: 2px 4px 2px 8px;
  background: color-mix(in srgb, var(--interrupt) 8%, transparent);
}
.ask.held { border-color: var(--steward); background: color-mix(in srgb, var(--steward) 8%, transparent); }
.ask button { padding: 1px 7px; font-size: 12px; }
.notice { color: var(--interrupt); }

/* Main row */
main { display: grid; grid-template-columns: 132px 1fr 330px; min-height: 0; }
.shelf { border-right: 1px solid var(--border); padding: 10px; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
.shelf h3, .insp h3 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); font-weight: 400; }
.shelf button { text-align: left; }
.shelf .k { display: block; font-size: 10px; color: var(--text-dim); }
.canvas-wrap { overflow: auto; position: relative; min-width: 0; }
.canvas { position: relative; width: 2120px; height: 560px; }
.canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.canvas svg .elabel { pointer-events: all; cursor: pointer; }
.empty-hint { position: absolute; left: 40px; top: 60px; max-width: 34em; color: var(--text-dim); border: 1px dashed var(--border); border-radius: 6px; padding: 16px; }
.linking-banner { position: sticky; left: 0; top: 0; z-index: 5; background: var(--accent); color: #06121c; padding: 4px 12px; font-weight: 700; }

/* Cards, after .node-card in the Console */
.card {
  position: absolute; width: 210px;
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px;
  user-select: none;
}
.card.k-grill { border-left: 3px solid var(--accent-purple); }
.card.s-running, .card.s-collecting { border-color: var(--running); }
.card.s-needs { border-color: var(--interrupt); box-shadow: 0 0 0 1px var(--interrupt); }
.card.s-parked { border-color: var(--accent); border-style: dashed; }
.card.s-done { opacity: .62; }
.card.s-halted { border-color: var(--interrupt); opacity: .7; }
.card.sel { box-shadow: 0 0 0 3px var(--accent); }
.card.changed .head { background: color-mix(in srgb, var(--accent) 16%, var(--bg-panel-2)); }
.card.linkable:hover { box-shadow: 0 0 0 2px var(--accent); cursor: crosshair; }
.head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
  background: var(--bg-panel-2); padding: 6px 10px; border-radius: 6px 6px 0 0; cursor: grab;
}
.head .id { font-weight: 700; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.state { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.state.running, .state.collecting { color: var(--running); }
.state.needs, .state.halted { color: var(--interrupt); }
.state.parked { color: var(--accent); }
.state.done { color: var(--done); }
.body { padding: 7px 10px 8px; font-size: 12px; display: grid; gap: 5px; }
.badge { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; outline: 1px solid var(--accent-purple); color: var(--accent-purple); border-radius: 3px; padding: 0 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 10.5px; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; color: var(--text-dim); }
.chip.on { color: var(--text); }
.chip.spawn-yes { color: var(--done); border-color: color-mix(in srgb, var(--done) 40%, var(--border)); }
.chip.spawn-ask { color: var(--steward); border-color: color-mix(in srgb, var(--steward) 40%, var(--border)); }
.chip.merge { color: var(--accent); }
.copies { display: flex; gap: 3px; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pending); }
.dot.running { background: var(--running); }
.dot.done { background: var(--done); }
.dot.checkpoint, .dot.closed { background: var(--interrupt); }
.dot.resting { background: var(--accent-purple); }
.dot.spawned { outline: 1px solid var(--steward); outline-offset: 1px; }
.ports { display: flex; gap: 4px; flex-wrap: wrap; border-top: 1px solid var(--border); padding: 5px 8px; }
.port { font-size: 11px; padding: 0 6px; border-radius: 10px; background: var(--bg); }
.port.parked { border-color: var(--accent); color: var(--accent); }
.port.parked::after { content: " ● waiting"; }
.port.armed { background: var(--accent); color: #06121c; }

/* Inspector */
.insp { border-left: 1px solid var(--border); padding: 10px 12px; overflow: auto; display: grid; align-content: start; gap: 12px; }
.field { display: grid; gap: 3px; }
.field > span { font-size: 11px; color: var(--text-dim); }
.seg { display: flex; flex-wrap: wrap; gap: 0; }
.seg button { border-radius: 0; margin-left: -1px; padding: 2px 8px; font-size: 12px; }
.seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
.seg button:last-child { border-radius: 0 4px 4px 0; }
.seg button.on { background: var(--accent); color: #06121c; border-color: var(--accent); position: relative; }
.help { font-size: 11px; color: var(--text-dim); }
.copyrow { border: 1px solid var(--border); border-radius: 4px; padding: 6px; display: grid; gap: 5px; }
.copyrow .top { display: flex; justify-content: space-between; gap: 6px; }
.copyrow .acts { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.copyrow .acts button { font-size: 11.5px; padding: 1px 6px; }
.copyrow input[type=number] { width: 4.2em; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sep { border: 0; border-top: 1px solid var(--border); margin: 0; width: 100%; }

/* Drawer */
.drawer { border-top: 1px solid var(--border); display: grid; grid-template-rows: auto 1fr; min-height: 0; background: var(--bg-panel); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { border: 0; border-radius: 0; background: none; padding: 6px 14px; color: var(--text-dim); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.pane { overflow: auto; padding: 10px max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 0; }
.wt { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
.wt-list { display: grid; align-content: start; gap: 4px; }
.wt-list button { text-align: left; }
.wt-list button.on { border-color: var(--accent); color: var(--accent); }
.wt-body p { margin: 0 0 8px; max-width: 70ch; }
.steps { display: grid; gap: 4px; }
.step { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.step .n { color: var(--text-dim); text-align: right; font-variant-numeric: tabular-nums; padding-top: 3px; }
.step button { text-align: left; width: 100%; }
.step button code { color: var(--text-dim); font-size: 11px; display: block; }
.step.done button { opacity: .5; }
.step.next button { border-color: var(--accent); }
.log { display: grid; gap: 6px; }
.log .e code { color: var(--accent); }
.log .l { padding-left: 14px; }
.tone-warn { color: var(--running); }
.tone-refuse { color: var(--interrupt); }
.tone-steward { color: var(--steward); }
.tone-good { color: var(--done); }
.tone-park { color: var(--accent); }
.agent-in { display: flex; gap: 6px; }
.agent-in input { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid2 > * { min-width: 0; }
textarea.json { width: 100%; height: 190px; resize: vertical; font-size: 11.5px; }
table { border-collapse: collapse; font-size: 12px; }
td, th { border-bottom: 1px solid var(--border); padding: 3px 10px 3px 0; text-align: left; vertical-align: top; }
th { color: var(--text-dim); font-weight: 400; }
.qa { max-width: 80ch; }
.qa p { margin: 0 0 8px; }

@media (max-width: 900px) {
  .app { grid-template-rows: auto auto minmax(420px, 1fr) auto auto; height: auto; }
  main { grid-template-columns: 1fr; }
  .shelf { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--border); }
  .canvas-wrap { height: 460px; }
  .insp { border-left: 0; border-top: 1px solid var(--border); }
  .drawer { min-height: 420px; }
  .wt, .grid2 { grid-template-columns: 1fr; }
}
</style>

<div class="app">
  <header>
    <div class="brand">HORDE<span>plan mode · prototype</span></div>
    <input id="plan-name" aria-label="Factory name">
    <select id="preset" aria-label="Load a preset"></select>
    <button data-cmd="new">New empty factory</button>
    <button data-ui="save-now" title="Save this layout as a preset and show its plan file">Save</button>
    <textarea id="prompt" rows="1" placeholder="Opening prompt for the first node… (Shift+Enter for a new line)" aria-label="Opening prompt"></textarea>
    <button class="primary" id="run-all">Run</button>
    <button data-cmd="reset run" title="Keep the layout, clear the run">Reset run</button>
    <span class="clock" id="clock"></span>
    <button data-cmd="tick" title="Advance the clock: resting copies wake (e.g. usage limit reset)">Tick clock</button>
  </header>
  <div class="tray" id="tray"></div>
  <main>
    <div class="shelf" id="shelf"></div>
    <div class="canvas-wrap" id="canvas-wrap"><div class="canvas" id="canvas"></div></div>
    <div class="insp" id="insp"></div>
  </main>
  <div class="drawer">
    <div class="tabs" id="tabs"></div>
    <div class="pane" id="pane"></div>
  </div>
</div>

<datalist id="dl-harness"><option>claude</option><option>codex</option><option>cursor</option><option>opencode</option></datalist>
<datalist id="dl-model"><option>opus</option><option>sonnet</option><option>haiku</option><option>gpt-5.5</option><option>composer-2</option></datalist>
<datalist id="dl-effort"><option>low</option><option>medium</option><option>high</option><option>xhigh</option></datalist>

<script>
/* ============================================================
   Horde: the plan-mode model. Pure; no DOM. Lift this out.
   reduce(state, action) -> state; parse(line) -> action;
   toCommand(action) -> line. The UI and an agent both speak
   through parse/toCommand, so anything one can do the other can.
   ============================================================ */
const Horde = (() => {
  const KINDS = {
    grill:   { label: 'Grill',   verdicts: ['done'], noun: 'slice', makes: { done: 3 }, cfg: { harness: 'claude', skill: 'my-grill-with-docs', model: 'opus', effort: 'high', spawn: 'no', checkpoint: 'wait', copies: { mode: 'one', n: 1 }, merge: 'auto' } },
    agent:   { label: 'Agent',   verdicts: ['done'], noun: 'item', makes: {}, cfg: { harness: 'claude', skill: '', model: 'sonnet', effort: 'medium', spawn: 'ask', checkpoint: 'wait', copies: { mode: 'one', n: 1 }, merge: 'auto' } },
    builder: { label: 'Builder', verdicts: ['done'], noun: 'item', makes: {}, cfg: { harness: 'claude', skill: 'tdd', model: 'opus', effort: 'high', spawn: 'ask', checkpoint: 'steward', copies: { mode: 'per-item', n: 3 }, merge: 'auto' } },
    prove:   { label: 'Prove',   verdicts: ['pass', 'fail'], noun: 'failure', makes: { fail: 1 }, cfg: { harness: 'claude', skill: 'my-verify', model: 'opus', effort: 'medium', spawn: 'no', checkpoint: 'steward', copies: { mode: 'one', n: 1 }, merge: 'auto' } },
    review:  { label: 'Review',  verdicts: ['clean', 'findings'], noun: 'finding', makes: { findings: 2 }, cfg: { harness: 'claude', skill: 'code-review', model: 'opus', effort: 'high', spawn: 'no', checkpoint: 'steward', copies: { mode: 'one', n: 1 }, merge: 'auto' } },
    decide:  { label: 'Decide',  verdicts: ['ship', 'another-round'], noun: 'note', makes: {}, cfg: { harness: 'claude', skill: 'html', model: 'opus', effort: 'medium', spawn: 'no', checkpoint: 'wait', copies: { mode: 'one', n: 1 }, merge: 'auto' } },
    gate:    { label: 'Gate',    verdicts: ['open'], gate: true, cfg: { open: 'operator', join: 'any' } },
    finish:  { label: 'Finish',  verdicts: [], terminal: true, cfg: {} },
  };
  const ENUMS = {
    spawn: ['no', 'ask', 'yes'],
    checkpoint: ['wait', 'steward', 'continue', 'rest'],
    merge: ['auto', 'off'],
    open: ['operator', 'steward', 'auto'],
    join: ['any', 'all'],
  };
  /* Free text: any harness the machine has. These are only quick picks. */
  const SUGGEST = {
    harness: ['claude', 'codex', 'cursor', 'opencode'],
    model: ['opus', 'sonnet', 'haiku', 'gpt-5.5', 'composer-2', 'kimi-k2'],
    effort: ['low', 'medium', 'high', 'xhigh'],
  };
  const ACTIVE = ['running', 'checkpoint', 'resting'];
  const isAgent = k => !KINDS[k].gate && !KINDS[k].terminal;
  function fieldsFor(kind) {
    if (KINDS[kind].gate) return ['title', 'open', 'join'];
    if (KINDS[kind].terminal) return ['title'];
    return ['title', 'skill', 'harness', 'model', 'effort', 'spawn', 'checkpoint', 'copies', 'merge'];
  }

  /* ---------- state ---------- */
  function freshRun() {
    return { live: false, prompt: '', clock: 0, nodes: {}, edges: {}, held: [], spent: [], finished: false, heldSeq: 0 };
  }
  function empty(name = 'Untitled factory', presets = {}) {
    return { plan: { name, nodes: {}, edges: [] }, run: freshRun(), presets, log: [], notice: null, changed: [] };
  }
  const rn = (s, id) => (s.run.nodes[id] ||= { status: 'idle', pass: 0, copies: [], parked: {}, inbox: [], arrived: {}, waiting: null, made: 0 });
  const es = (s, id) => (s.run.edges[id] ||= { count: 0 });
  const edgeId = (from, on, to) => `${from}.${on}>${to}`;

  /* ---------- the file a plan saves as ---------- */
  function toFile(s) {
    return {
      horde: 1,
      name: s.plan.name,
      nodes: Object.values(s.plan.nodes).map(n => structuredClone(n)),
      edges: s.plan.edges.map(e => ({ from: e.from, on: e.on, to: e.to, ...(e.max != null ? { max: e.max } : {}) })),
    };
  }
  function fromFile(f) {
    if (!f || f.horde !== 1 || !Array.isArray(f.nodes) || !Array.isArray(f.edges)) throw new Error('That is not a Horde plan file (it needs "horde": 1, nodes and edges).');
    const nodes = {};
    for (const n of f.nodes) {
      if (!KINDS[n.kind]) throw new Error(`Unknown node type "${n.kind}".`);
      nodes[n.id] = { ...structuredClone(KINDS[n.kind].cfg), ...structuredClone(n) };
    }
    const edges = f.edges.map(e => {
      if (!nodes[e.from] || !nodes[e.to]) throw new Error(`Edge ${e.from} → ${e.to} names a node that is not in the file.`);
      return { id: edgeId(e.from, e.on, e.to), from: e.from, on: e.on, to: e.to, max: e.max ?? null };
    });
    return { name: f.name || 'Untitled factory', nodes, edges };
  }

  /* ---------- reducer ---------- */
  function say(s, text, tone = 'info') { s.log[s.log.length - 1].lines.push({ text, tone }); }
  function refuse(s, text) { s.notice = text; say(s, text, 'refuse'); }

  function reduce(state, a) {
    const s = structuredClone(state);
    s.notice = null;
    s.changed = [];
    if (!a.quiet) s.log.push({ cmd: toCommand(a), lines: [] });
    else s.log.push({ cmd: null, lines: [] });
    const h = H[a.type];
    if (!h) refuse(s, `I don't know how to "${a.type}".`);
    else h(s, a);
    if (a.quiet && !s.log[s.log.length - 1].lines.length) s.log.pop();
    return s;
  }

  const findNode = (s, id) => s.plan.nodes[id];
  function findCopy(s, copyId) {
    const nodeId = String(copyId).split('#')[0];
    const r = s.run.nodes[nodeId];
    const c = r && r.copies.find(c => c.id === copyId);
    return c ? { c, r, node: s.plan.nodes[nodeId] } : null;
  }
  function reachable(s, from, to) {
    const seen = new Set([from]); const q = [from];
    while (q.length) {
      const x = q.shift();
      if (x === to) return true;
      for (const e of s.plan.edges) if (e.from === x && !seen.has(e.to)) { seen.add(e.to); q.push(e.to); }
    }
    return false;
  }
  const busy = r => r.copies.some(c => ACTIVE.includes(c.status));
  const plural = (n, w) => `${n} ${n === 1 ? w : w.endsWith('y') ? w.slice(0, -1) + 'ies' : w + 's'}`;

  function copyCount(node, items) {
    const c = node.copies;
    if (c.mode === 'fixed') return Math.max(1, c.n);
    if (c.mode === 'per-item') return Math.min(Math.max(items.length, 1), Math.max(1, c.n));
    return 1;
  }

  function startNode(s, id, packet, opts = {}) {
    const node = findNode(s, id), r = rn(s, id), K = KINDS[node.kind];
    s.changed.push(id);
    if (K.terminal) {
      r.pass++; r.status = 'done'; s.run.finished = true;
      say(s, `Reached ${node.title}. The run is finished.`, 'good');
      return;
    }
    if (busy(r)) {
      r.inbox.push(packet);
      say(s, `${id} is still working, so the handoff from ${packet.from} waits in its inbox.`);
      return;
    }
    const lostParked = Object.keys(r.parked);
    if (lostParked.length) say(s, `${id} starts again; its earlier waiting handoff (${lostParked.join(', ')}) is replaced.`, 'warn');
    r.pass++; r.status = 'running'; r.parked = {}; r.made = 0; r.input = packet;
    const items = packet.items || [];
    const n = opts.single ? 1 : copyCount(node, items);
    r.copies = [];
    for (let i = 0; i < n; i++) {
      let item;
      if (node.copies.mode === 'per-item') item = items.filter((_, k) => k % n === i).join(', ') || null;
      else item = items.length ? items.join(', ') : null;
      r.copies.push({ id: `${id}#${r.pass}.${i + 1}`, status: 'running', item, out: null, verdict: null, spawned: !!opts.spawned, wakeAt: null });
    }
    let why = '';
    if (node.copies.mode === 'per-item' && !opts.single) {
      why = items.length > n ? ` (${items.length} items shared between ${n}, the most it may run)` : ` (one per item)`;
    }
    say(s, `${id} pass ${r.pass} starts ${plural(n, 'copy')}${why}.`);
  }

  function nodeMaybeDone(s, id) {
    const node = findNode(s, id), r = rn(s, id), K = KINDS[node.kind];
    if (busy(r)) return;
    s.changed.push(id);
    if (r.copies.some(c => c.status === 'closed')) {
      r.status = 'halted';
      say(s, `${id} halted because a copy was closed. Nothing flows on from it until you run it again.`, 'warn');
      return;
    }
    const ok = K.verdicts[0];
    const verdict = r.copies.map(c => c.verdict).find(v => v !== ok) ?? ok;
    const items = r.copies.flatMap(c => c.out || []);
    let branch = r.copies[0].id;
    if (r.copies.length > 1) {
      if (node.merge === 'auto') { branch = 'line base'; say(s, `Merger: ${r.copies.length} branches from ${id} merged into the line base.`, 'good'); }
      else { branch = r.copies.map(c => c.id).join(' + '); say(s, `Merge is off for ${id}: its ${r.copies.length} branches stay separate.`, 'warn'); }
    }
    r.status = 'done'; r.verdict = verdict;
    say(s, `${id} finished: ${verdict}${items.length ? `, handing on ${plural(items.length, 'item')}` : ''}.`);
    emit(s, id, verdict, { from: id, verdict, items, branch });
    if (r.inbox.length && !busy(r)) startNode(s, id, r.inbox.shift());
  }

  function emit(s, id, verdict, packet) {
    const outs = s.plan.edges.filter(e => e.from === id && e.on === verdict);
    if (!outs.length) {
      const r = rn(s, id);
      r.parked[verdict] = packet;
      if (r.status === 'done') r.status = 'parked';
      say(s, `Nothing follows ${id} on "${verdict}" yet, so its handoff waits here. Link a next step and it flows on.`, 'park');
      return;
    }
    for (const e of outs) traverse(s, e, packet);
  }

  function traverse(s, e, packet) {
    const st = es(s, e.id);
    if (e.max != null && st.count >= e.max) {
      s.run.spent.push({ edge: e.id, packet });
      say(s, `The loop ${e.from} → ${e.to} has used all ${e.max} of its passes. The run waits for you: allow one more pass, or stop the loop.`, 'warn');
      return;
    }
    st.count++;
    s.changed.push(e.id);
    deliver(s, e.to, packet, e.id);
  }

  function deliver(s, to, packet, via) {
    const node = findNode(s, to);
    if (!KINDS[node.kind].gate) return startNode(s, to, packet);
    const r = rn(s, to);
    s.changed.push(to);
    r.arrived[via] = packet;
    const incoming = s.plan.edges.filter(e => e.to === to);
    const got = incoming.filter(e => r.arrived[e.id]).length;
    if (node.join === 'all' && got < incoming.length) {
      r.status = 'collecting';
      say(s, `${to} has ${got} of ${incoming.length} inputs and waits for the rest.`);
      return;
    }
    const packets = Object.values(r.arrived);
    r.arrived = {};
    const combined = { from: packets.map(p => p.from).join(' + '), verdict: 'open', items: packets.flatMap(p => p.items), branch: packets.map(p => p.branch).join(' + ') };
    if (node.open === 'operator') {
      r.status = 'waiting'; r.waiting = combined;
      say(s, `${to} is closed until you open it.`, 'warn');
      return;
    }
    if (node.open === 'steward') say(s, `The Steward opened ${to} on your behalf.`, 'steward');
    r.pass++; r.status = 'done';
    emit(s, to, 'open', combined);
  }

  function addCopy(s, nodeId, item, why) {
    const r = rn(s, nodeId);
    s.changed.push(nodeId);
    if (busy(r)) {
      const c = { id: `${nodeId}#${r.pass}.${r.copies.length + 1}`, status: 'running', item, out: null, verdict: null, spawned: true, wakeAt: null };
      r.copies.push(c);
      say(s, `${why} ${c.id} joins the running pass and will merge with it.`, 'good');
    } else {
      say(s, `${why} ${nodeId} had already finished, so it runs one more pass for it.`, 'good');
      startNode(s, nodeId, { from: 'spawn', items: [item] }, { single: true, spawned: true });
    }
  }

  function parseCopies(v) {
    if (typeof v === 'object' && v) return v;
    const m = String(v).match(/^(one|fixed|per-item)(?::(\d+))?$/);
    if (!m) return null;
    if (m[1] === 'one') return { mode: 'one', n: 1 };
    return { mode: m[1], n: Math.max(1, +(m[2] || (m[1] === 'fixed' ? 2 : 3))) };
  }

  const H = {
    newEmpty(s, a) {
      const p = s.presets;
      Object.assign(s, empty(a.name || 'Untitled factory', p));
      s.log = [{ cmd: 'new', lines: [] }];
      say(s, 'Started an empty factory. Put a node down from the shelf, or load a preset.');
    },
    rename(s, a) { s.plan.name = a.name; say(s, `Renamed to "${a.name}".`); },
    preset(s, a) {
      const f = s.presets[a.name];
      if (!f) return refuse(s, `There is no preset called "${a.name}".`);
      const log = s.log;
      s.plan = fromFile(f); s.run = freshRun();
      s.log = log;
      say(s, `Loaded the preset "${f.name}".`);
    },
    load(s, a) {
      try { s.plan = fromFile(a.file); s.run = freshRun(); say(s, `Loaded "${s.plan.name}" from a plan file.`); }
      catch (err) { refuse(s, err.message); }
    },
    savePreset(s, a) {
      const name = a.name || s.plan.name;
      s.presets[name] = { ...toFile(s), name };
      say(s, `Saved this layout as the preset "${name}".`, 'good');
    },
    resetRun(s) { s.run = freshRun(); say(s, 'Cleared the run. The layout is untouched.'); },

    addNode(s, a) {
      const K = KINDS[a.kind];
      if (!K) return refuse(s, `There is no node type called "${a.kind}". Try ${Object.keys(KINDS).join(', ')}.`);
      let id = a.id;
      if (id && s.plan.nodes[id]) return refuse(s, `${id} already exists.`);
      if (!id) { id = a.kind; let n = 1; while (s.plan.nodes[id]) id = `${a.kind}-${++n}`; }
      const count = Object.keys(s.plan.nodes).length;
      s.plan.nodes[id] = { id, kind: a.kind, title: a.title || K.label, x: a.x ?? 40 + (count % 7) * 300, y: a.y ?? 60 + Math.floor(count / 7) * 240, ...structuredClone(K.cfg) };
      s.changed.push(id);
      say(s, `Put down ${a.title || K.label} as ${id}.`);
    },
    removeNode(s, a) {
      const node = findNode(s, a.id);
      if (!node) return refuse(s, `There is no node ${a.id}.`);
      const r = s.run.nodes[a.id];
      if (r && (busy(r) || ['waiting', 'collecting'].includes(r.status))) return refuse(s, `${a.id} is in the middle of a pass. Close its copies or let it finish before you remove it.`);
      delete s.plan.nodes[a.id];
      delete s.run.nodes[a.id];
      const gone = s.plan.edges.filter(e => e.from === a.id || e.to === a.id).map(e => e.id);
      s.plan.edges = s.plan.edges.filter(e => !gone.includes(e.id));
      s.run.spent = s.run.spent.filter(x => !gone.includes(x.edge));
      s.run.held = s.run.held.filter(h => h.node !== a.id);
      say(s, `Removed ${a.id}${gone.length ? ` and ${plural(gone.length, 'link')}` : ''}.`);
    },
    move(s, a) { const n = findNode(s, a.id); if (n) { n.x = a.x; n.y = a.y; } },
    set(s, a) {
      const node = findNode(s, a.id);
      if (!node) return refuse(s, `There is no node ${a.id}.`);
      if (!fieldsFor(node.kind).includes(a.field)) return refuse(s, `A ${KINDS[node.kind].label} has no "${a.field}" setting. It has: ${fieldsFor(node.kind).join(', ')}.`);
      let v = a.value;
      if (ENUMS[a.field] && !ENUMS[a.field].includes(v)) return refuse(s, `"${v}" is not a choice for ${a.field}. Pick one of ${ENUMS[a.field].join(', ')}.`);
      if (a.field === 'copies') { v = parseCopies(v); if (!v) return refuse(s, 'Copies is one, fixed:N or per-item:MAX.'); }
      if (['harness', 'model', 'effort'].includes(a.field) && !String(v).trim()) return refuse(s, `${a.field} cannot be empty.`);
      node[a.field] = v;
      s.changed.push(a.id);
      const r = s.run.nodes[a.id];
      const later = r && busy(r) && a.field === 'copies' ? ' The running pass keeps its copies; this applies from the next pass.' : '';
      say(s, `${a.id}: ${a.field} is now ${a.field === 'copies' ? fmtCopies(v) : v}.${later}`);
    },
    link(s, a) {
      const from = findNode(s, a.from), to = findNode(s, a.to);
      if (!from || !to) return refuse(s, `Both ends must be nodes on the canvas (${a.from} → ${a.to}).`);
      if (!KINDS[from.kind].verdicts.includes(a.on)) return refuse(s, `${a.from} never says "${a.on}". It says ${KINDS[from.kind].verdicts.join(' or ') || 'nothing; it ends the run'}.`);
      if (a.from === a.to) return refuse(s, `A node cannot feed itself. Loop back through another node instead.`);
      const id = edgeId(a.from, a.on, a.to);
      if (s.plan.edges.some(e => e.id === id)) return refuse(s, `That link already exists.`);
      const back = reachable(s, a.to, a.from);
      let max = a.max ?? null;
      if (back && max == null) max = 2;
      s.plan.edges.push({ id, from: a.from, on: a.on, to: a.to, max });
      s.changed.push(id);
      say(s, back ? `Linked ${a.from} "${a.on}" back to ${a.to}. It loops, so it is capped at ${max} passes.` : `Linked ${a.from} "${a.on}" → ${a.to}.`);
      const r = s.run.nodes[a.from];
      const parked = r && r.parked[a.on];
      if (parked) {
        delete r.parked[a.on];
        if (r.status === 'parked' && !Object.keys(r.parked).length) r.status = 'done';
        say(s, `${a.from}'s waiting handoff flows on to ${a.to}.`, 'park');
        traverse(s, s.plan.edges.find(e => e.id === id), parked);
      }
    },
    unlink(s, a) {
      if (!s.plan.edges.some(e => e.id === a.edge)) return refuse(s, `There is no link ${a.edge}.`);
      s.plan.edges = s.plan.edges.filter(e => e.id !== a.edge);
      s.run.spent = s.run.spent.filter(x => x.edge !== a.edge);
      say(s, `Removed the link ${a.edge}.`);
    },
    setLoop(s, a) {
      const e = s.plan.edges.find(e => e.id === a.edge);
      if (!e) return refuse(s, `There is no link ${a.edge}.`);
      if (a.max == null && reachable(s, e.to, e.from)) return refuse(s, `${a.edge} loops back, and a loop always needs a cap.`);
      if (a.max != null && (!Number.isInteger(a.max) || a.max < 1)) return refuse(s, 'A cap is a whole number of passes, 1 or more.');
      e.max = a.max;
      s.changed.push(e.id);
      say(s, a.max == null ? `${a.edge} has no cap.` : `${a.edge} is capped at ${a.max} passes (used ${es(s, e.id).count}).`);
    },

    run(s, a) {
      const node = findNode(s, a.id);
      if (!node) return refuse(s, `There is no node ${a.id}.`);
      if (!isAgent(node.kind)) return refuse(s, `${a.id} is a ${KINDS[node.kind].label}; run an agent node instead.`);
      const r = s.run.nodes[a.id];
      if (r && busy(r)) return refuse(s, `${a.id} is already running.`);
      if (a.prompt != null) s.run.prompt = a.prompt;
      s.run.live = true;
      startNode(s, a.id, { from: 'you', verdict: 'prompt', items: [], note: s.run.prompt });
    },
    runAll(s, a) {
      const entries = Object.values(s.plan.nodes).filter(n => isAgent(n.kind) && !s.plan.edges.some(e => e.to === n.id));
      if (!entries.length) return refuse(s, 'There is no node to start: put an agent node down first.');
      if (a.prompt != null) s.run.prompt = a.prompt;
      if (!s.run.prompt) return refuse(s, 'Write an opening prompt first.');
      s.run.live = true;
      for (const n of entries) if (!busy(rn(s, n.id))) startNode(s, n.id, { from: 'you', verdict: 'prompt', items: [], note: s.run.prompt });
    },
    finish(s, a) {
      const f = findCopy(s, a.copy);
      if (!f) return refuse(s, `There is no copy ${a.copy}.`);
      const { c, r, node } = f, K = KINDS[node.kind];
      if (c.status !== 'running') return refuse(s, `${a.copy} is ${c.status}; only a running copy can finish.`);
      if (!K.verdicts.includes(a.verdict)) return refuse(s, `${node.id} says ${K.verdicts.join(' or ')}, not "${a.verdict}".`);
      const n = a.items ?? (K.makes[a.verdict] || 0);
      c.status = 'done'; c.verdict = a.verdict;
      if (n > 0) {
        c.out = [];
        for (let i = 0; i < n; i++) { r.made++; c.out.push(`${K.noun} ${r.made}${r.pass > 1 ? ` (pass ${r.pass})` : ''}`); }
      } else c.out = c.item ? [c.item] : [];
      say(s, `${a.copy} said "${a.verdict}"${n > 0 ? ` with ${plural(n, K.noun)}` : ''}.`);
      nodeMaybeDone(s, node.id);
    },
    checkpoint(s, a) {
      const f = findCopy(s, a.copy);
      if (!f) return refuse(s, `There is no copy ${a.copy}.`);
      const { c, node } = f;
      if (c.status !== 'running') return refuse(s, `${a.copy} is ${c.status}; only a running copy can stop at a checkpoint.`);
      s.changed.push(node.id);
      switch (node.checkpoint) {
        case 'wait': c.status = 'checkpoint'; say(s, `${a.copy} stopped at a checkpoint and waits for you.`, 'warn'); break;
        case 'steward': say(s, `${a.copy} stopped at a checkpoint. The Steward answered it and the copy carried on.`, 'steward'); break;
        case 'continue': say(s, `${a.copy} stopped at a checkpoint. The engine typed "continue" and it carried on.`); break;
        case 'rest': c.status = 'resting'; c.wakeAt = s.run.clock + 1; say(s, `${a.copy} rests until the clock ticks (say, a usage limit resets). The rest of the run carries on.`); break;
      }
    },
    resume(s, a) {
      const f = findCopy(s, a.copy);
      if (!f) return refuse(s, `There is no copy ${a.copy}.`);
      if (!['checkpoint', 'resting'].includes(f.c.status)) return refuse(s, `${a.copy} is ${f.c.status}; there is nothing to resume.`);
      f.c.status = 'running'; f.c.wakeAt = null; s.changed.push(f.node.id);
      say(s, `${a.copy} resumed.`);
    },
    close(s, a) {
      const f = findCopy(s, a.copy);
      if (!f) return refuse(s, `There is no copy ${a.copy}.`);
      if (!ACTIVE.includes(f.c.status)) return refuse(s, `${a.copy} is already ${f.c.status}.`);
      f.c.status = 'closed';
      say(s, `Closed ${a.copy}.`, 'warn');
      nodeMaybeDone(s, f.node.id);
    },
    tick(s) {
      s.run.clock++;
      let woke = 0;
      for (const r of Object.values(s.run.nodes)) for (const c of r.copies) if (c.status === 'resting' && c.wakeAt <= s.run.clock) { c.status = 'running'; c.wakeAt = null; woke++; s.changed.push(c.id.split('#')[0]); }
      say(s, `The clock is at ${s.run.clock}.${woke ? ` ${plural(woke, 'resting copy')} woke and carried on.` : ''}`);
    },
    spawn(s, a) {
      const f = findCopy(s, a.copy);
      if (!f) return refuse(s, `There is no copy ${a.copy}.`);
      if (f.c.status !== 'running') return refuse(s, `${a.copy} is ${f.c.status}; only a running copy proposes follow-up work.`);
      const node = f.node;
      if (node.spawn === 'no') return say(s, `${node.id} may not spawn, so ${a.copy}'s proposal "${a.what}" was dropped.`, 'refuse');
      if (node.spawn === 'ask') {
        const id = `h${++s.run.heldSeq}`;
        s.run.held.push({ id, node: node.id, from: a.copy, what: a.what });
        return say(s, `${a.copy} proposed "${a.what}". It is held as ${id} until you adopt or discard it.`, 'steward');
      }
      addCopy(s, node.id, a.what, `${a.copy} spawned "${a.what}".`);
    },
    adopt(s, a) {
      const h = s.run.held.find(h => h.id === a.held);
      if (!h) return refuse(s, `There is no held spawn ${a.held}.`);
      s.run.held = s.run.held.filter(x => x !== h);
      addCopy(s, h.node, h.what, `You adopted ${h.id}.`);
    },
    discard(s, a) {
      const h = s.run.held.find(h => h.id === a.held);
      if (!h) return refuse(s, `There is no held spawn ${a.held}.`);
      s.run.held = s.run.held.filter(x => x !== h);
      say(s, `Discarded ${h.id} ("${h.what}").`);
    },
    open(s, a) {
      const node = findNode(s, a.id), r = s.run.nodes[a.id];
      if (!node || !KINDS[node.kind].gate) return refuse(s, `${a.id} is not a gate.`);
      if (!r || r.status !== 'waiting') return refuse(s, `${a.id} has nothing waiting at it${r && r.status === 'collecting' ? ' yet; it still waits for inputs' : ''}.`);
      const p = r.waiting; r.waiting = null; r.pass++; r.status = 'done'; s.changed.push(a.id);
      say(s, `You opened ${a.id}.`, 'good');
      emit(s, a.id, 'open', p);
    },
    allow(s, a) {
      const x = s.run.spent.find(x => x.edge === a.edge);
      if (!x) return refuse(s, `${a.edge} is not waiting on a spent loop.`);
      s.run.spent = s.run.spent.filter(y => y !== x);
      const e = s.plan.edges.find(e => e.id === a.edge);
      e.max++;
      say(s, `You allowed one more pass round ${a.edge} (cap now ${e.max}).`);
      traverse(s, e, x.packet);
    },
    stop(s, a) {
      const x = s.run.spent.find(x => x.edge === a.edge);
      if (!x) return refuse(s, `${a.edge} is not waiting on a spent loop.`);
      s.run.spent = s.run.spent.filter(y => y !== x);
      const e = s.plan.edges.find(e => e.id === a.edge);
      const r = rn(s, e.from);
      r.parked[e.on] = x.packet; r.status = 'parked';
      say(s, `You stopped the loop. ${e.from}'s "${e.on}" handoff waits there; link it somewhere else to carry on.`, 'park');
    },
  };

  /* ---------- the command language an agent speaks ---------- */
  const q = v => (v == null ? '' : /[\s"]/.test(String(v)) || v === '' ? `"${String(v).replace(/"/g, "'")}"` : String(v));
  const fmtCopies = c => (c.mode === 'one' ? 'one' : `${c.mode}:${c.n}`);
  function toCommand(a) {
    switch (a.type) {
      case 'newEmpty': return 'new' + (a.name ? ` ${q(a.name)}` : '');
      case 'rename': return `name ${q(a.name)}`;
      case 'preset': return `preset ${q(a.name)}`;
      case 'load': return 'load <plan file>';
      case 'savePreset': return `save ${q(a.name || '')}`.trim();
      case 'resetRun': return 'reset run';
      case 'addNode': return `add ${a.kind}${a.id ? ` as ${a.id}` : ''}${a.x != null ? ` at ${a.x} ${a.y}` : ''}${a.title ? ` ${q(a.title)}` : ''}`;
      case 'removeNode': return `remove ${a.id}`;
      case 'move': return `move ${a.id} ${a.x} ${a.y}`;
      case 'set': return `set ${a.id} ${a.field} ${a.field === 'copies' && typeof a.value === 'object' ? fmtCopies(a.value) : q(a.value)}`;
      case 'link': return `link ${a.from}.${a.on} -> ${a.to}${a.max != null ? ` max ${a.max}` : ''}`;
      case 'unlink': return `unlink ${a.edge}`;
      case 'setLoop': return `loop ${a.edge} max ${a.max ?? 'none'}`;
      case 'run': return `run ${a.id}${a.prompt != null ? ` ${q(a.prompt)}` : ''}`;
      case 'runAll': return `run all${a.prompt != null ? ` ${q(a.prompt)}` : ''}`;
      case 'finish': return `finish ${a.copy} ${a.verdict}${a.items != null ? ` items ${a.items}` : ''}`;
      case 'spawn': return `spawn ${a.copy} ${q(a.what)}`;
      case 'checkpoint': case 'resume': case 'close': return `${a.type} ${a.copy}`;
      case 'adopt': case 'discard': return `${a.type} ${a.held}`;
      case 'open': return `open ${a.id}`;
      case 'allow': case 'stop': return `${a.type} ${a.edge}`;
      case 'tick': return 'tick';
      default: return a.type;
    }
  }
  function parse(line) {
    const t = []; const re = /"([^"]*)"|(\S+)/g; let m;
    while ((m = re.exec(line))) t.push(m[1] ?? m[2]);
    const [v, ...r] = t;
    switch (v) {
      case 'new': return { type: 'newEmpty', name: r[0] };
      case 'name': return { type: 'rename', name: r[0] };
      case 'preset': return { type: 'preset', name: r.join(' ') };
      case 'save': return { type: 'savePreset', name: r.join(' ') || undefined };
      case 'reset': return { type: 'resetRun' };
      case 'add': {
        const a = { type: 'addNode', kind: r[0] };
        for (let i = 1; i < r.length; i++) {
          if (r[i] === 'as') a.id = r[++i];
          else if (r[i] === 'at') { a.x = +r[++i]; a.y = +r[++i]; }
          else a.title = r[i];
        }
        return a;
      }
      case 'remove': return { type: 'removeNode', id: r[0] };
      case 'move': return { type: 'move', id: r[0], x: +r[1], y: +r[2] };
      case 'set': return { type: 'set', id: r[0], field: r[1], value: r.slice(2).join(' ') };
      case 'link': {
        const [from, on] = (r[0] || '').split('.');
        const a = { type: 'link', from, on, to: r[1] === '->' ? r[2] : r[1] };
        const mi = r.indexOf('max'); if (mi > 0) a.max = +r[mi + 1];
        return a;
      }
      case 'unlink': return { type: 'unlink', edge: r[0] };
      case 'loop': return { type: 'setLoop', edge: r[0], max: r[2] === 'none' ? null : +r[2] };
      case 'run': return r[0] === 'all' ? { type: 'runAll', prompt: r[1] } : { type: 'run', id: r[0], prompt: r[1] };
      case 'finish': return { type: 'finish', copy: r[0], verdict: r[1], items: r[2] === 'items' ? +r[3] : undefined };
      case 'spawn': return { type: 'spawn', copy: r[0], what: r.slice(1).join(' ') };
      case 'checkpoint': case 'resume': case 'close': return { type: v, copy: r[0] };
      case 'adopt': case 'discard': return { type: v, held: r[0] };
      case 'open': return { type: 'open', id: r[0] };
      case 'allow': case 'stop': return { type: v, edge: r[0] };
      case 'tick': return { type: 'tick' };
      default: return { type: v || '(empty)' };
    }
  }

  function run(state, lines) {
    return lines.reduce((s, l) => reduce(s, parse(l)), state);
  }

  return { KINDS, ENUMS, SUGGEST, fieldsFor, isAgent, empty, freshRun, reduce, parse, toCommand, toFile, fromFile, run, fmtCopies, ACTIVE };
})();
</script>

<script>
/* ============================================================
   The page: a thin shell over Horde. Throwaway.
   ============================================================ */
let state = Horde.run(Horde.empty('Factory today', structuredClone(BUILT_IN)), ['preset Factory today']);
state.log = [];
const ui = { sel: null, linking: null, tab: 'walk', walk: 0, step: 0, agentErr: '' };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const K = Horde.KINDS;

function dispatch(a) { state = Horde.reduce(state, a); if (ui.sel && ui.sel.kind === 'node' && !state.plan.nodes[ui.sel.id]) ui.sel = null; render(); }
function send(line) { dispatch(Horde.parse(line)); }

function nodeState(id) {
  const r = state.run.nodes[id];
  if (!r) return { cls: 'idle', text: 'not run' };
  if (r.copies.some(c => c.status === 'checkpoint')) return { cls: 'needs', text: 'needs you' };
  if (r.status === 'waiting') return { cls: 'needs', text: 'closed · open me' };
  if (r.status === 'collecting') return { cls: 'collecting', text: 'collecting' };
  if (r.status === 'running') {
    const live = r.copies.filter(c => Horde.ACTIVE.includes(c.status)).length;
    return { cls: 'running', text: `running ${live}/${r.copies.length}` };
  }
  if (r.status === 'parked') return { cls: 'parked', text: 'done · waiting' };
  if (state.run.spent.some(x => state.plan.edges.find(e => e.id === x.edge)?.from === id)) return { cls: 'needs', text: 'loop spent' };
  if (r.status === 'halted') return { cls: 'halted', text: 'halted' };
  if (r.status === 'done') return { cls: 'done', text: r.verdict ? `done · ${r.verdict}` : 'done' };
  return { cls: 'idle', text: r.status };
}

function render() {
  $('plan-name').value = state.plan.name;
  $('clock').textContent = `clock ${state.run.clock}`;
  if (document.activeElement !== $('prompt')) $('prompt').value = state.run.prompt;
  renderPresets(); renderTray(); renderShelf(); renderCanvas(); renderInsp(); renderDrawer();
}

function renderPresets() {
  $('preset').innerHTML = `<option value="">Load a preset…</option>` + Object.keys(state.presets).map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
}

function renderTray() {
  const asks = [];
  for (const [id, r] of Object.entries(state.run.nodes)) {
    for (const c of r.copies) if (c.status === 'checkpoint') asks.push(`<span class="ask">${esc(c.id)} at a checkpoint <button data-cmd="resume ${c.id}">Resume</button><button data-cmd="close ${c.id}">Close</button></span>`);
    if (r.status === 'waiting') asks.push(`<span class="ask">${esc(id)} is closed <button data-cmd="open ${id}">Open</button></span>`);
  }
  for (const h of state.run.held) asks.push(`<span class="ask held">${esc(h.id)} from ${esc(h.from)}: "${esc(h.what)}" <button data-cmd="adopt ${h.id}">Adopt</button><button data-cmd="discard ${h.id}">Discard</button></span>`);
  for (const x of state.run.spent) asks.push(`<span class="ask">loop ${esc(x.edge)} spent <button data-cmd="allow ${x.edge}">Allow one more</button><button data-cmd="stop ${x.edge}">Stop loop</button></span>`);
  const notice = state.notice ? `<span class="notice">✕ ${esc(state.notice)}</span>` : '';
  const done = state.run.finished ? `<span class="tone-good">Run finished.</span>` : '';
  $('tray').innerHTML = `<span class="label">Needs you</span>${asks.join('') || '<span class="dim">nothing</span>'}${done}${notice}`;
}

function renderShelf() {
  const desc = { grill: 'talk it through', agent: 'any skill', builder: 'writes code, ×n', prove: 'pass / fail', review: 'clean / findings', decide: 'ship / again', gate: 'join + approve', finish: 'ends the run' };
  $('shelf').innerHTML = `<h3>Put down</h3>` + Object.entries(K).map(([k, v]) => `<button data-cmd="add ${k}">${v.label}<span class="k">${desc[k]}</span></button>`).join('');
}

function cardHtml(n) {
  const st = nodeState(n.id), r = state.run.nodes[n.id];
  const kind = K[n.kind];
  const chips = [];
  if (Horde.isAgent(n.kind)) {
    chips.push(`<span class="chip spawn-${n.spawn}">spawn ${n.spawn}</span>`);
    chips.push(`<span class="chip">checkpoint ${n.checkpoint}</span>`);
    chips.push(`<span class="chip on">×${n.copies.mode === 'one' ? '1' : n.copies.mode === 'fixed' ? n.copies.n : `per item ≤${n.copies.n}`}</span>`);
    if (n.copies.mode !== 'one') chips.push(`<span class="chip merge">${n.merge === 'auto' ? '⋈ auto-merge' : 'no merge'}</span>`);
  } else if (kind.gate) {
    chips.push(`<span class="chip on">opens: ${n.open}</span>`, `<span class="chip">join ${n.join}</span>`);
  }
  const sub = Horde.isAgent(n.kind) ? `<span class="dim">${esc(n.skill || 'no skill')}</span><span class="dim">${esc(n.harness)} · ${esc(n.model)} · ${esc(n.effort)}</span>` : `<span class="dim">${kind.gate ? 'no agent' : 'end of the run'}</span>`;
  const dots = r && r.copies.length ? `<div class="copies" title="copies this pass">${r.copies.map(c => `<span class="dot ${c.status}${c.spawned ? ' spawned' : ''}" title="${esc(c.id)}: ${c.status}"></span>`).join('')}<span class="dim" style="font-size:10.5px">pass ${r.pass}</span></div>` : '';
  const ports = kind.verdicts.length ? `<div class="ports">${kind.verdicts.map(v => {
    const parked = r && r.parked[v];
    const armed = ui.linking && ui.linking.from === n.id && ui.linking.on === v;
    const linked = state.plan.edges.some(e => e.from === n.id && e.on === v);
    return `<button class="port${parked ? ' parked' : ''}${armed ? ' armed' : ''}${linked ? '' : ' open'}" data-port="${n.id}.${v}" data-ui="port" title="Link: click this, then click the node that follows when it says ${v}">${v} →</button>`;
  }).join('')}</div>` : '';
  const cls = ['card', `k-${n.kind}`, `s-${st.cls === 'collecting' ? 'collecting' : st.cls}`];
  if (ui.sel && ui.sel.kind === 'node' && ui.sel.id === n.id) cls.push('sel');
  if (state.changed.includes(n.id)) cls.push('changed');
  if (ui.linking && ui.linking.from !== n.id) cls.push('linkable');
  return `<div class="${cls.join(' ')}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px">
    <div class="head" data-drag="${n.id}"><span class="id">${esc(n.title)}</span><span class="state ${st.cls}">${st.text}</span></div>
    <div class="body"><div class="row"><span class="badge">${kind.label}</span><span class="dim">${esc(n.id)}</span></div>${sub}<div class="chips">${chips.join('')}</div>${dots}</div>
    ${ports}</div>`;
}

function renderCanvas() {
  const nodes = Object.values(state.plan.nodes);
  const banner = ui.linking ? `<div class="linking-banner">Linking ${esc(ui.linking.from)} "${esc(ui.linking.on)}": click the node that follows. Esc cancels.</div>` : '';
  const hint = nodes.length ? '' : `<div class="empty-hint"><b>An empty factory.</b><br>Put a node down from the shelf on the left. You can run it straight away and decide what follows once you see what it hands over. To link two nodes, click a verdict chip at the bottom of a card (like <b>done →</b>) and then the next node, or use Links in the inspector. When you like the shape, press <b>Save</b>.</div>`;
  $('canvas').innerHTML = banner + `<svg id="edges"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8597"></path></marker><marker id="arr-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4cc2ff"></path></marker></defs></svg>` + hint + nodes.map(cardHtml).join('');
  drawEdges();
}

function drawEdges() {
  const svg = $('edges'); if (!svg) return;
  const base = $('canvas').getBoundingClientRect();
  [...svg.querySelectorAll('.e')].forEach(x => x.remove());
  let out = '';
  for (const e of state.plan.edges) {
    const pe = document.querySelector(`[data-port="${e.from}.${e.on}"]`);
    const te = document.querySelector(`[data-node="${e.to}"]`);
    if (!pe || !te) continue;
    const p = pe.getBoundingClientRect(), t = te.getBoundingClientRect();
    const sx = p.left + p.width / 2 - base.left, sy = p.bottom - base.top;
    const back = t.left - base.left < sx - 30;
    let d, mx, my;
    if (!back) {
      const src = pe.closest('.card').getBoundingClientRect();
      const fx = src.right - base.left, fy = p.top + p.height / 2 - base.top;
      const tx = t.left - base.left, ty = t.top - base.top + 16;
      const k = Math.max(30, (tx - fx) / 2);
      d = `M${sx + p.width / 2},${fy} L${fx},${fy} C${fx + k},${fy} ${tx - k},${ty} ${tx},${ty}`;
      [mx, my] = bez([fx, fy], [fx + k, fy], [tx - k, ty], [tx, ty]);
    } else {
      const tx = t.left - base.left + t.width / 2 + 30, ty = t.bottom - base.top;
      const drop = 60 + (Math.abs(sx - tx) / 1600) * 110;
      d = `M${sx},${sy} C${sx},${sy + drop} ${tx},${ty + drop} ${tx},${ty}`;
      [mx, my] = bez([sx, sy], [sx, sy + drop], [tx, ty + drop], [tx, ty]);
    }
    const st = state.run.edges[e.id];
    const hot = state.changed.includes(e.id);
    const spent = state.run.spent.some(x => x.edge === e.id);
    const sel = ui.sel && ui.sel.kind === 'edge' && ui.sel.id === e.id;
    const label = `${e.on}${e.max != null ? ` · ${st ? st.count : 0}/${e.max}` : st && st.count ? ` · ×${st.count}` : ''}`;
    const col = spent ? '#f85149' : hot || sel ? '#4cc2ff' : '#3a4560';
    out += `<path class="e" d="${d}" fill="none" stroke="${col}" stroke-width="${sel ? 2.5 : 1.6}" ${back ? 'stroke-dasharray="5 4"' : ''} marker-end="url(#${hot || sel ? 'arr-hot' : 'arr'})"></path>`;
    const w = label.length * 6.1 + 10;
    out += `<g class="e elabel" data-edge="${esc(e.id)}"><rect x="${mx - w / 2}" y="${my - 9}" width="${w}" height="18" rx="9" fill="#12161f" stroke="${col}"></rect><text x="${mx}" y="${my + 4}" text-anchor="middle" font-size="10" fill="${spent ? '#f85149' : '#d4dae4'}" font-family="ui-monospace, Liberation Mono, monospace">${esc(label)}</text></g>`;
  }
  svg.insertAdjacentHTML('beforeend', out);
}
function bez(a, b, c, d, t = 0.5) {
  const u = 1 - t;
  return [0, 1].map(i => u * u * u * a[i] + 3 * u * u * t * b[i] + 3 * u * t * t * c[i] + t * t * t * d[i]);
}

function seg(id, field, value, choices) {
  return `<div class="seg">${choices.map(c => `<button class="${c === value ? 'on' : ''}" data-cmd="set ${id} ${field} ${c}">${c}</button>`).join('')}</div>`;
}
const HELP = {
  spawn: { no: 'Proposals are dropped.', ask: 'Proposals wait in Needs you for Adopt or Discard.', yes: 'Proposals become a new copy at once.' },
  checkpoint: { wait: 'The copy stops and waits for you.', steward: 'The Steward answers on your behalf.', continue: 'The engine types "continue" and it carries on.', rest: 'The copy sleeps until the clock ticks; the rest carry on.' },
  open: { operator: 'Waits for you to open it.', steward: 'The Steward opens it for you.', auto: 'Opens as soon as its inputs arrive.' },
};

function renderInsp() {
  const el = $('insp');
  if (ui.sel && ui.sel.kind === 'edge') {
    const e = state.plan.edges.find(e => e.id === ui.sel.id);
    if (!e) { ui.sel = null; return renderInsp(); }

    el.innerHTML = `<h3>Link</h3><div><b>${esc(e.from)}</b> says <b>${esc(e.on)}</b> → <b>${esc(e.to)}</b></div>
      <div class="field"><span>Passes allowed${e.max == null ? ' (no cap)' : ''} · used ${st ? st.count : 0}</span>
      <div class="row"><input type="number" min="1" id="edge-max" value="${e.max ?? ''}" placeholder="none" style="width:6em"><button data-ui="edge-max" data-edge="${esc(e.id)}">Set cap</button><button data-cmd="loop ${e.id} max none">No cap</button></div>
      <span class="help">A link that loops back always keeps a cap. When the cap is used up, the run asks you before going round again.</span></div>
      <button class="warn" data-cmd="unlink ${e.id}">Remove link</button>`;
    return;
  }
  const n = ui.sel && state.plan.nodes[ui.sel.id];
  if (!n) {
    const s = state.run;
    el.innerHTML = `<h3>Factory</h3><div class="help">Click a node to set it up and drive its copies. Click a verdict chip (like <b>done →</b>) and then another node to link them. Drag a node by its head. Click a link's label to cap its loop.</div>
      <hr class="sep"><h3>Run</h3><table>
      <tr><th>Nodes</th><td>${Object.keys(state.plan.nodes).length}</td></tr>
      <tr><th>Running</th><td>${Object.values(s.nodes).filter(r => r.status === 'running').length}</td></tr>
      <tr><th>Waiting handoffs</th><td>${Object.entries(s.nodes).filter(([, r]) => Object.keys(r.parked).length).map(([id]) => esc(id)).join(', ') || '—'}</td></tr>
      <tr><th>Held spawns</th><td>${s.held.length}</td></tr>
      <tr><th>Spent loops</th><td>${s.spent.length}</td></tr>
      <tr><th>Finished</th><td>${s.finished ? 'yes' : 'no'}</td></tr></table>`;
    return;
  }
  const kind = K[n.kind], r = state.run.nodes[n.id];
  let cfg = `<h3>${kind.label} · ${esc(n.id)}</h3>
    <label class="field"><span>Title</span><input id="f-title" data-field="title" value="${esc(n.title)}"></label>`;
  if (Horde.isAgent(n.kind)) {
    cfg += `<label class="field"><span>Skill (driver)</span><input id="f-skill" data-field="skill" value="${esc(n.skill)}"></label>
      ${['harness', 'model', 'effort'].map(f => `<label class="field"><span>${f[0].toUpperCase() + f.slice(1)}</span><input id="f-${f}" data-field="${f}" value="${esc(n[f])}" list="dl-${f}">
        <div class="quick">${Horde.SUGGEST[f].map(c => `<button type="button" class="${c === n[f] ? 'on' : ''}" data-cmd="set ${n.id} ${f} ${c}">${c}</button>`).join('')}</div></label>`).join('')}
      <div class="field"><span>May it spawn follow-up work?</span>${seg(n.id, 'spawn', n.spawn, Horde.ENUMS.spawn)}<span class="help">${HELP.spawn[n.spawn]}</span></div>
      <div class="field"><span>When a copy checkpoints</span>${seg(n.id, 'checkpoint', n.checkpoint, Horde.ENUMS.checkpoint)}<span class="help">${HELP.checkpoint[n.checkpoint]}</span></div>
      <div class="field"><span>Copies per pass</span><div class="row"><div class="seg">${['one', 'fixed', 'per-item'].map(m => `<button class="${n.copies.mode === m ? 'on' : ''}" data-cmd="set ${n.id} copies ${m === 'one' ? 'one' : `${m}:${n.copies.n > 1 ? n.copies.n : m === 'fixed' ? 2 : 3}`}">${m}</button>`).join('')}</div>
        ${n.copies.mode !== 'one' ? `<input type="number" min="1" id="f-copies-n" value="${n.copies.n}" style="width:4.5em" data-copies="${n.copies.mode}" title="${n.copies.mode === 'fixed' ? 'how many' : 'at most'}">` : ''}</div>
        <span class="help">${n.copies.mode === 'one' ? 'One copy, whatever it is handed.' : n.copies.mode === 'fixed' ? `Always ${n.copies.n} copies.` : `One copy per item handed in (slices, findings), at most ${n.copies.n}.`}</span></div>
      ${n.copies.mode !== 'one' ? `<div class="field"><span>When all copies finish</span>${seg(n.id, 'merge', n.merge, Horde.ENUMS.merge)}<span class="help">${n.merge === 'auto' ? 'A merger folds every branch into the line base.' : 'Branches stay separate and travel on as they are.'}</span></div>` : ''}`;
  } else if (kind.gate) {
    cfg += `<div class="field"><span>Who opens it</span>${seg(n.id, 'open', n.open, Horde.ENUMS.open)}<span class="help">${HELP.open[n.open]}</span></div>
      <div class="field"><span>Inputs</span>${seg(n.id, 'join', n.join, Horde.ENUMS.join)}<span class="help">${n.join === 'all' ? 'Waits until every incoming link has delivered.' : 'Any one incoming link is enough.'}</span></div>`;
  }
  if (kind.verdicts.length) {
    const outs = state.plan.edges.filter(e => e.from === n.id);
    const others = Object.values(state.plan.nodes).filter(o => o.id !== n.id);
    cfg += `<hr class="sep"><h3>Links: what comes next</h3><div class="links">
      ${outs.map(e => `<div class="linkrow"><span>says <b>${esc(e.on)}</b> → ${esc(state.plan.nodes[e.to].title)}${e.max != null ? ` <span class="dim">· cap ${e.max}</span>` : ''}</span><span><button data-ui="sel-edge" data-edge="${esc(e.id)}">Edit</button> <button data-cmd="unlink ${e.id}">✕</button></span></div>`).join('') || `<span class="help">Nothing follows yet. Whatever it hands over will wait on it until you link a next step.</span>`}
      ${others.length ? `<div class="addlink"><span class="dim">when it says</span><select id="link-on">${kind.verdicts.map(v => `<option>${v}</option>`).join('')}</select><span class="dim">go to</span><select id="link-to">${others.map(o => `<option value="${o.id}">${esc(o.title)} (${o.id})</option>`).join('')}</select><button class="primary" data-ui="add-link" data-id="${n.id}">Link</button></div>` : `<span class="help">Put another node down to link to it.</span>`}
      <span class="help">On the canvas: click a verdict chip like <b>${esc(kind.verdicts[0])} →</b>, then click the next node.</span></div>`;
  }
  let runHtml = `<hr class="sep"><h3>This run</h3>`;
  if (Horde.isAgent(n.kind)) {
    const canRun = !(r && r.copies.some(c => Horde.ACTIVE.includes(c.status)));
    runHtml += `<div class="row"><button class="primary" ${canRun ? '' : 'disabled'} data-ui="run-node" data-id="${n.id}">Run this node</button><span class="help">uses the opening prompt</span></div>`;
  }
  if (r) {
    runHtml += `<div class="help">Pass ${r.pass} · ${esc(nodeState(n.id).text)}${r.input && r.input.items && r.input.items.length ? ` · handed: ${esc(r.input.items.join(', '))}` : ''}${r.inbox.length ? ` · ${r.inbox.length} in inbox` : ''}</div>`;
    for (const [v, p] of Object.entries(r.parked)) runHtml += `<div class="tone-park">Waiting handoff on "${esc(v)}": ${esc(p.items.join(', ') || 'no items')}. Link ${esc(v)} → somewhere to pass it on.</div>`;
    if (r.status === 'waiting') runHtml += `<button class="primary" data-cmd="open ${n.id}">Open gate</button>`;
    for (const c of r.copies) {
      const live = c.status === 'running';
      const makes = v => (kind.makes[v] != null ? kind.makes[v] : 0);
      runHtml += `<div class="copyrow"><div class="top"><b>${esc(c.id)}${c.spawned ? ' <span class="tone-steward">spawned</span>' : ''}</b><span class="state ${c.status === 'checkpoint' ? 'needs' : c.status === 'done' ? 'done' : c.status === 'running' ? 'running' : ''}">${c.status}${c.verdict ? ` · ${c.verdict}` : ''}</span></div>
        <div class="help">${c.item ? `works on: ${esc(c.item)}` : 'works on: the opening prompt'}${c.out && c.out.length ? ` · hands on: ${esc(c.out.join(', '))}` : ''}</div>
        ${live ? `<div class="acts">${kind.verdicts.map(v => `<button data-ui="finish" data-copy="${c.id}" data-verdict="${v}">${v}</button>`).join('')}
          <label class="dim" title="How many items this verdict hands on (slices, findings). 0 passes on what it was given.">items <input type="number" min="0" id="items-${esc(c.id)}" value="${kind.verdicts.length ? makes(kind.verdicts.find(v => kind.makes[v]) || kind.verdicts[0]) : 0}"></label></div>
          <div class="acts"><button data-cmd="checkpoint ${c.id}">Checkpoint</button><button data-ui="spawn" data-copy="${c.id}">Propose spawn</button><button data-cmd="close ${c.id}">Close</button></div>` : ''}
        ${c.status === 'checkpoint' || c.status === 'resting' ? `<div class="acts"><button data-cmd="resume ${c.id}">Resume</button><button data-cmd="close ${c.id}">Close</button></div>` : ''}</div>`;
    }
  }
  el.innerHTML = cfg + runHtml + `<hr class="sep"><button class="warn" data-cmd="remove ${n.id}">Remove node</button>`;
}

const TABS = [['walk', 'Walkthroughs'], ['agent', 'Agent'], ['file', 'Plan file'], ['state', 'State'], ['log', 'Log'], ['about', 'What this answers']];
function renderDrawer() {
  $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="${ui.tab === k ? 'on' : ''}" data-ui="tab" data-tab="${k}">${l}</button>`).join('');
  const p = $('pane');
  if (ui.tab === 'walk') {
    const w = WALKS[ui.walk];
    p.innerHTML = `<div class="wt"><div class="wt-list">${WALKS.map((x, i) => `<button class="${i === ui.walk ? 'on' : ''}" data-ui="walk" data-i="${i}">${esc(x.title)}</button>`).join('')}</div>
      <div class="wt-body"><p>${esc(w.desc)}</p><p class="row"><button data-ui="walk-reset">Start this walkthrough again</button><span class="dim">Each step is the same command an agent would send.</span></p>
      <div class="steps">${w.steps.map(([label, cmd], i) => `<div class="step ${i < ui.step ? 'done' : i === ui.step ? 'next' : ''}"><span class="n">${i + 1}</span><button ${i === ui.step ? '' : 'disabled'} data-ui="step" data-i="${i}">${esc(label)}<code>${esc(cmd)}</code></button></div>`).join('')}</div>
      ${ui.step >= w.steps.length ? `<p class="tone-good" style="margin-top:8px">Done. Keep poking at it with free play, or try the next walkthrough.</p>` : ''}</div></div>`;
  } else if (ui.tab === 'agent') {
    p.innerHTML = `<div class="grid2"><div><p class="dim" style="margin-top:0">An agent changes the plan and drives the run with the same commands every button sends. Type one and press Enter.</p>
      <form class="agent-in" id="agent-form"><input id="agent-line" placeholder='set builder spawn ask' autocomplete="off"><button class="primary">Send</button></form>
      ${state.notice ? `<p class="notice">✕ ${esc(state.notice)}</p>` : ''}
      <p class="dim">Last commands sent (by you or the buttons):</p><div class="log">${state.log.slice(-6).reverse().map(e => `<div class="e"><code>${esc(e.cmd)}</code></div>`).join('')}</div></div>
      <div><table><tr><th>Lay out</th><td><code>add builder as fixer at 340 60 "Fixer"</code><br><code>link review.findings -> fixer max 2</code><br><code>set fixer copies per-item:4</code><br><code>set fixer spawn ask</code> · <code>set fixer checkpoint rest</code><br><code>set fixer harness cursor</code> · <code>set fixer model composer-2</code><br><code>set fixer merge off</code> · <code>loop review.findings>fixer max 3</code><br><code>remove fixer</code> · <code>unlink e</code></td></tr>
      <tr><th>Run</th><td><code>run grill "prompt"</code> · <code>run all</code><br><code>finish grill#1.1 done items 3</code><br><code>checkpoint builder#1.2</code> · <code>resume</code> · <code>close</code> · <code>tick</code><br><code>spawn builder#1.1 "what"</code> · <code>adopt h1</code> · <code>discard h1</code><br><code>open approve</code> · <code>allow e</code> · <code>stop e</code></td></tr>
      <tr><th>Files</th><td><code>save "My setup"</code> · <code>preset MPocock</code> · <code>new</code> · <code>name "x"</code></td></tr></table></div></div>`;
  } else if (ui.tab === 'file') {
    p.innerHTML = `<div class="grid2"><div><p class="dim" style="margin-top:0">This is the whole saved factory: a small JSON file you can keep in git. Edit it and load it back, or paste one in.</p>
      <textarea class="json" id="file-text" spellcheck="false">${esc(JSON.stringify(Horde.toFile(state), null, 2))}</textarea>
      <div class="row"><button data-ui="copy-file">Copy</button><button data-ui="load-file">Load from text</button><span id="file-msg" class="dim"></span></div></div>
      <div>${ui.justSaved ? `<p class="saved" style="margin-top:0">Saved "${esc(ui.justSaved)}" as a preset. In the real thing this writes the plan file on the left into the repo, e.g. <code>.horde/${esc(ui.justSaved.toLowerCase().replace(/[^a-z0-9]+/g, '-'))}.json</code>.</p>` : ''}<p class="dim" style="margin-top:0">Presets in this session (not saved anywhere: it is a prototype).</p>
      <div class="row"><input id="save-name" placeholder="Name for this setup" value="${esc(state.plan.name)}"><button class="primary" data-ui="save-preset">Save as preset</button></div>
      <table style="margin-top:8px">${Object.entries(state.presets).map(([name, f]) => `<tr><td>${esc(name)}</td><td class="dim">${f.nodes.length} nodes · ${f.edges.length} links</td><td><button data-cmd='preset ${esc(name)}'>Load</button></td></tr>`).join('')}</table></div></div>`;
  } else if (ui.tab === 'state') {
    const rows = Object.values(state.plan.nodes).map(n => {
      const r = state.run.nodes[n.id];
      return `<tr><td>${esc(n.id)}</td><td>${esc(nodeState(n.id).text)}</td><td>${r ? r.pass : 0}</td><td>${r ? r.copies.map(c => `${esc(c.id)} ${c.status}`).join('<br>') : '—'}</td><td>${r ? Object.entries(r.parked).map(([v, p]) => `${v}: ${esc(p.items.join(', ') || '—')}`).join('<br>') || '—' : '—'}</td><td>${r ? r.inbox.length : 0}</td></tr>`;
    }).join('');
    const erows = state.plan.edges.map(e => `<tr><td>${esc(e.id)}</td><td>${state.run.edges[e.id]?.count || 0}</td><td>${e.max ?? 'no cap'}</td><td>${state.run.spent.some(x => x.edge === e.id) ? '<span class="tone-refuse">spent, waiting</span>' : ''}</td></tr>`).join('');
    p.innerHTML = `<div class="grid2"><div style="overflow-x:auto"><table><tr><th>Node</th><th>State</th><th>Pass</th><th>Copies</th><th>Waiting handoff</th><th>Inbox</th></tr>${rows}</table></div>
      <div style="overflow-x:auto"><table><tr><th>Link</th><th>Used</th><th>Cap</th><th></th></tr>${erows}</table>
      <p class="dim">Held spawns: ${state.run.held.map(h => `${esc(h.id)} (${esc(h.what)})`).join(', ') || 'none'} · clock ${state.run.clock} · prompt: ${esc(state.run.prompt || '—')}</p></div></div>`;
  } else if (ui.tab === 'log') {
    p.innerHTML = `<div class="log">${state.log.slice().reverse().map(e => `<div class="e"><code>› ${esc(e.cmd)}</code>${e.lines.map(l => `<div class="l tone-${l.tone}">${esc(l.text)}</div>`).join('')}</div>`).join('') || '<span class="dim">Nothing yet.</span>'}</div>`;
  } else {
    p.innerHTML = `<div class="qa"><p><b>Question.</b> If the Factory stops being a fixed run of Stations and becomes a plan you lay out yourself, does this model hold together? A plan is nodes and links. Each node says whether it may spawn (no, ask, yes), what happens when a copy checkpoints (wait, Steward, continue, rest), and how many copies it runs (one, a fixed number, or one per item handed in) with an automatic merger when there is more than one. Links carry a verdict and loops always carry a cap. Gates join inputs and wait for someone to open them.</p>
      <p><b>The awkward parts to feel out:</b> running a node before anything follows it (its handoff waits on the node until you link onward); changing settings mid-run (spawn and checkpoint apply at once, copies from the next pass); a spent loop (the run asks you, like today's "each Resume buys one fix"); and whether an agent driving the same commands as the buttons is enough "control by the agent".</p>
      <p><b>Not modelled:</b> real agents, merge conflicts and the resolver, spawn caps, the Grill as a Conversation, Prove checking merged work, persistence. The Pstack preset is a guess at its shape. ADR-0037 rejected a user-defined Station graph; this prototype tests whether reversing it is worth it.</p></div>`;
  }
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-cmd],[data-ui],[data-node],[data-edge]');
  if (!t) return;
  if (t.dataset.cmd) { if (ui.linking) ui.linking = null; return send(t.dataset.cmd); }
  const u = t.dataset.ui;
  if (u === 'port') { const [from, on] = t.dataset.port.split('.'); ui.linking = ui.linking && ui.linking.from === from && ui.linking.on === on ? null : { from, on }; ev.stopPropagation(); return render(); }
  if (u === 'tab') { ui.tab = t.dataset.tab; ui.justSaved = null; return renderDrawer(); }
  if (u === 'walk') { ui.walk = +t.dataset.i; return startWalk(); }
  if (u === 'walk-reset') return startWalk();
  if (u === 'step') { const [, cmd] = WALKS[ui.walk].steps[+t.dataset.i]; ui.step++; return send(cmd); }
  if (u === 'run-node') return send(`run ${t.dataset.id} "${($('prompt').value || '').replace(/"/g, "'")}"`);
  if (u === 'finish') {
    const inp = document.getElementById(`items-${t.dataset.copy}`);
    const n = inp ? Math.max(0, parseInt(inp.value || '0', 10)) : 0;
    return send(`finish ${t.dataset.copy} ${t.dataset.verdict} items ${n}`);
  }
  if (u === 'spawn') { const what = ['Fix a flaky test', 'Add a missing migration', 'Tidy the error messages', 'Write docs for the new flag'][Math.floor(Math.random() * 4)]; return send(`spawn ${t.dataset.copy} ${what}`); }
  if (u === 'edge-max') { const v = $('edge-max').value; return send(`loop ${t.dataset.edge} max ${v === '' ? 'none' : v}`); }
  if (u === 'copy-file') { const txt = $('file-text').value; navigator.clipboard?.writeText(txt).then(() => { $('file-msg').textContent = 'Copied.'; }, () => { $('file-text').select(); $('file-msg').textContent = 'Selected; press Ctrl+C.'; }); return; }
  if (u === 'load-file') { try { dispatch({ type: 'load', file: JSON.parse($('file-text').value) }); } catch (err) { $('file-msg').textContent = 'That is not valid JSON: ' + err.message; } return; }
  if (u === 'add-link') return send(`link ${t.dataset.id}.${$('link-on').value} -> ${$('link-to').value}`);
  if (u === 'sel-edge') { ui.sel = { kind: 'edge', id: t.dataset.edge }; return render(); }
  if (u === 'save-now') { send(`save ${JSON.stringify(state.plan.name.replace(/"/g, "'"))}`); ui.tab = 'file'; ui.justSaved = state.plan.name; return renderDrawer(); }
  if (u === 'save-preset') return send(`save "${($('save-name').value || state.plan.name).replace(/"/g, "'")}"`);
  if (t.dataset.edge && !t.dataset.ui && !t.dataset.cmd) { ui.sel = { kind: 'edge', id: t.dataset.edge }; return render(); }
  if (t.dataset.node) {
    if (ui.linking) { const { from, on } = ui.linking; ui.linking = null; if (from !== t.dataset.node) return send(`link ${from}.${on} -> ${t.dataset.node}`); return render(); }
    if (dragMoved) return;
    ui.sel = { kind: 'node', id: t.dataset.node }; return render();
  }
});
$('canvas-wrap').addEventListener('click', ev => { if (ev.target.id === 'canvas' || ev.target.id === 'canvas-wrap' || ev.target.tagName === 'svg') { ui.sel = null; ui.linking = null; render(); } });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ui.linking) { ui.linking = null; render(); } });
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.field && ui.sel) send(`set ${ui.sel.id} ${t.dataset.field} "${t.value.replace(/"/g, "'")}"`);
  if (t.dataset.copies && ui.sel) send(`set ${ui.sel.id} copies ${t.dataset.copies}:${Math.max(1, parseInt(t.value || '1', 10))}`);
  if (t.id === 'plan-name') send(`name "${t.value.replace(/"/g, "'")}"`);
  if (t.id === 'preset' && t.value) send(`preset ${t.value}`);
  if (t.id === 'prompt') state.run.prompt = t.value;
});
document.addEventListener('submit', ev => {
  if (ev.target.id !== 'agent-form') return;
  ev.preventDefault();
  const line = $('agent-line').value.trim();
  if (line) send(line);
  ui.tab = 'agent'; renderDrawer();
  setTimeout(() => $('agent-line')?.focus(), 0);
});
$('prompt').addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $('run-all').click(); }
});
$('run-all').addEventListener('click', () => send(`run all "${($('prompt').value || '').replace(/"/g, "'")}"`));

/* drag a card by its head */
let drag = null, dragMoved = false;
document.addEventListener('pointerdown', ev => {
  const h = ev.target.closest('[data-drag]');
  if (!h || ui.linking) return;
  const card = h.parentElement;
  drag = { id: h.dataset.drag, card, sx: ev.clientX, sy: ev.clientY, x: card.offsetLeft, y: card.offsetTop };
  dragMoved = false;
});
document.addEventListener('pointermove', ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
  if (!dragMoved) return;
  drag.card.style.left = Math.max(0, drag.x + dx) + 'px';
  drag.card.style.top = Math.max(0, drag.y + dy) + 'px';
  drawEdges();
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  if (dragMoved) dispatch({ type: 'move', id: drag.id, x: drag.card.offsetLeft, y: drag.card.offsetTop, quiet: true });
  drag = null;
  setTimeout(() => { dragMoved = false; }, 0);
});

function startWalk() {
  const w = WALKS[ui.walk];
  let s = Horde.empty('Walkthrough', state.presets);
  s = Horde.run(s, w.setup);
  s.log = [{ cmd: `— walkthrough: ${w.title} —`, lines: [] }];
  s.notice = null; s.changed = [];
  state = s; ui.step = 0; ui.sel = null; ui.linking = null;
  render();
}

startWalk();
</script>
